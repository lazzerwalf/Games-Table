function onTrumpsPlayCard(playerId, cardId){
  if(uiLock || game.awaitingTrumpCall) return;
  let result;
  try{ result = game.playCard(playerId, cardId); } catch(e){ return; }
  sfxCardPlay();
  handleTrumpsPlayResult(result);
}

function handleTrumpsPlayResult(result){
  if(result.trickComplete){
    const winner = game.getPlayer(result.trickWinnerId);
    showToast(`${winner.name} wins the trick!`);
    uiLock = true;
    render(); // shows the completed trick, all cards still laid out
    setTimeout(()=>{
      game.finishTrickAndAdvance();
      uiLock = false;
      if(game.gameOver) sfxWin();
      afterTrumpsAction();
      if(game.awaitingCut) maybeRunTrumpsCutBot();
    }, 1800);
  } else {
    uiLock = false;
    afterTrumpsAction();
  }
}

function afterTrumpsAction(){
  render();
  if(!game.roundComplete && !game.trickComplete) maybeRunTrumpsBotTurn();
}

function maybeRunTrumpsBotTurn(){
  if(!game || game.gameOver || game.roundComplete || game.trickComplete || game.awaitingTrumpCall) return;
  const cp = game.currentPlayer();
  if(!cp.isBot) return;
  uiLock = true;
  render();
  setTimeout(()=> runTrumpsBotTurn(cp), 650);
}

function runTrumpsBotTurn(bot){
  if(!game || game.gameOver || game.roundComplete || game.trickComplete || game.awaitingTrumpCall){ uiLock=false; if(game) render(); return; }
  if(game.currentPlayer().id !== bot.id){ uiLock=false; return; }
  const card = trumpsBotChoosePlay(bot, game);
  let result;
  try{ result = game.playCard(bot.id, card.id); } catch(e){ uiLock=false; return; }
  sfxCardPlay();
  handleTrumpsPlayResult(result);
}

/* ======================= NUMBERS UI (local) ======================= */
function renderNumbersRulesPanel(){
  const wrap = document.createElement('div');
  wrap.className = 'rules-content';
  wrap.innerHTML = `
    <h4>Setup</h4>
    <p>2–6 players. Each round, one player (rotating clockwise) picks how many large numbers (from 25, 50, 75, 100) they want, from 0 to 4 — the rest are small numbers (1–10, each appearing twice). The six numbers are drawn at random from those pools, then a random 3-digit target between 100 and 999 is set.</p>

    <h4>Solving</h4>
    <p>Everyone gets the same six numbers and target, one at a time. You have a set time limit (chosen at setup) to combine numbers using +, −, ×, ÷ to get as close to the target as possible — tap two numbers then an operator to combine them, and keep going. You don't have to use all six numbers. Results can never go negative or come out as a fraction.</p>

    <h4>Scoring</h4>
    <ul>
      <li>Exact target — 10 points</li>
      <li>Within 5 — 7 points</li>
      <li>Within 10 — 5 points</li>
      <li>More than 10 away — 0 points</li>
    </ul>
    <p>After everyone's had a turn, the best possible answer is revealed. Scores add up round after round — end the game whenever you like, and whoever has the most points wins.</p>
  `;
  return wrap;
}

function humanPlayersNumbers(){ return game.players.filter(p=>!p.isBot); }

let numbersCalc = null; // {pool:[{id,value,isResult}], selectedId, history:[], lastResultId, timeLeft, timerHandle}
let numbersTurnStarted = false;

function numbersOpValid(op, a, b){
  if(op==='+') return true;
  if(op==='×') return true;
  if(op==='-') return a!==b; // some order gives a positive result unless they're equal
  if(op==='÷') return (b>0 && a%b===0) || (a>0 && b%a===0);
  return false;
}
function numbersApplyOp(op, a, b){
  if(op==='+') return a+b;
  if(op==='×') return a*b;
  if(op==='-') return Math.abs(a-b);
  if(op==='÷') return (b>0 && a%b===0) ? a/b : b/a;
}

function numbersSignature(nums){ return (nums||[]).map(n=>n.id).join(','); }

function startNumbersCalc(numbersArr, timeLimitOverride){
  const nums = numbersArr || game.numbers;
  numbersCalc = {
    pool: nums.map(n=>({id:n.id, value:n.value, isResult:false})),
    selectedId: null,
    history: [],
    lastResultId: null,
    timeLeft: timeLimitOverride!==undefined ? timeLimitOverride : numbersTimeLimit,
    timerHandle: null,
    forNumbers: numbersSignature(nums),
  };
}

function stopNumbersTimer(){
  if(numbersCalc && numbersCalc.timerHandle){ clearInterval(numbersCalc.timerHandle); numbersCalc.timerHandle=null; }
}

function startNumbersTimer(){
  stopNumbersTimer();
  numbersCalc.timerHandle = setInterval(()=>{
    numbersCalc.timeLeft--;
    if(numbersCalc.timeLeft<=0){
      stopNumbersTimer();
      if(activeGameId==='numbers-online') onlineNumbersSubmitAnswer();
      else onNumbersSubmit();
      return;
    }
    render();
  }, 1000);
}

function renderNumbersScreen(){
  const el = document.createElement('div');

  if(game.gameOver) return renderNumbersGameOver(el);

  if(game.phase==='picking') return renderNumbersPickingScreen(el);
  if(game.phase==='reveal') return renderNumbersRevealScreen(el);

function renderNumbersSolvingScreen(el){
  const main = renderNumbersTopbar(el, `Numbers — Round ${game.roundNum}`);
  const solver = game.currentSolver();
  const multiHuman = humanPlayersNumbers().length>1;

  if(!numbersCalc || numbersCalc.forNumbers !== numbersSignature(game.numbers)){
    stopNumbersTimer();
    startNumbersCalc();
    numbersTurnStarted = false;
  }

  if(solver.isBot){
    const wrap = document.createElement('div');
    wrap.style.cssText = 'padding:30px;text-align:center;';
    wrap.innerHTML = `
      <div class="numbers-target">Target<span class="target-value">${game.target}</span></div>
      <div class="numbers-pool"></div>
      <p style="font-size:13px;color:#cfe4da;opacity:.75;margin-top:16px;">${solver.name} is working it out…</p>
    `;
    const poolRow = wrap.querySelector('.numbers-pool');
    game.numbers.forEach(n=>{
      const tok = document.createElement('div');
      tok.className = 'numbers-token';
      tok.textContent = n.value;
      poolRow.appendChild(tok);
    });
    main.appendChild(wrap);
    return el;
  }

  if(!numbersTurnStarted){
    const wrap = document.createElement('div');
    wrap.className = 'privacy-shield';
    wrap.style.position = 'static';
    wrap.style.minHeight = '300px';
    wrap.innerHTML = `
      <div class="display">${multiHuman ? `Pass the device to ${solver.name}` : `Ready, ${solver.name}?`}</div>
      <div style="opacity:.75;font-size:13px;">You'll have ${numbersTimeLimit} seconds once you start.</div>
      <button class="primary-btn" style="width:auto;padding:12px 26px;">Start my ${numbersTimeLimit} seconds</button>
    `;
    wrap.querySelector('button').addEventListener('click', ()=>{
      numbersTurnStarted = true;
      startNumbersTimer();
      render();
    });
    main.appendChild(wrap);
    return el;
  }

  const wrap = document.createElement('div');
  wrap.style.cssText = 'padding:16px;';
  wrap.innerHTML = `
    <div class="numbers-timer${numbersCalc.timeLeft<=10?' low':''}">${numbersCalc.timeLeft}s</div>
    <div class="numbers-target">Target<span class="target-value">${game.target}</span></div>
    <div class="numbers-pool"></div>
    <div class="numbers-op-row"></div>
    <div class="numbers-current-value"></div>
    <div class="numbers-history"></div>
    <div style="display:flex;gap:12px;justify-content:center;margin-top:14px;">
      <button class="ghost-btn" id="numbersResetBtn">Reset</button>
      <button class="primary-btn" id="numbersSubmitBtn" style="width:auto;padding:12px 26px;margin-top:0;">Submit</button>
    </div>
  `;
  main.appendChild(wrap);

  const poolRow = wrap.querySelector('.numbers-pool');
  numbersCalc.pool.forEach(tok=>{
    const el2 = document.createElement('div');
    el2.className = 'numbers-token' + ((tok.id===numbersCalc.selectedId||tok.id===numbersCalc.secondId)?' selected':'') + (tok.isResult?' result':'');
    el2.textContent = tok.value;
    el2.addEventListener('click', ()=> onNumbersTokenClick(tok.id));
    poolRow.appendChild(el2);
  });

  const opRow = wrap.querySelector('.numbers-op-row');
  const tokA = numbersCalc.selectedId ? numbersCalc.pool.find(t=>t.id===numbersCalc.selectedId) : null;
  const tokB = numbersCalc.secondId ? numbersCalc.pool.find(t=>t.id===numbersCalc.secondId) : null;
  ['+','-','×','÷'].forEach(op=>{
    const btn = document.createElement('button');
    btn.className = 'numbers-op-btn';
    btn.textContent = op;
    btn.disabled = !(tokA && tokB && numbersOpValid(op, tokA.value, tokB.value));
    btn.addEventListener('click', ()=> onNumbersOperatorClick(op));
    opRow.appendChild(btn);
  });

  const currentValueEl = wrap.querySelector('.numbers-current-value');
  const lastTok = numbersCalc.lastResultId ? numbersCalc.pool.find(t=>t.id===numbersCalc.lastResultId) : null;
  currentValueEl.textContent = lastTok ? 'Current best: ' : (numbersCalc.history.length===0 ? 'Combine two numbers to begin' : '');
  if(lastTok){
    const span = document.createElement('span');
    span.className = 'val';
    span.textContent = lastTok.value;
    currentValueEl.appendChild(span);
  }

  const historyEl = wrap.querySelector('.numbers-history');
  numbersCalc.history.forEach(line=>{
    const d = document.createElement('div');

    historyEl.appendChild(d);
  });

  wrap.querySelector('#numbersResetBtn').addEventListener('click', ()=>{

    startNumbersCalc();

    startNumbersTimer();
    render();
  });

  return el;
}

function onNumbersTokenClick(tokenId){
  if(!numbersCalc) return;
  if(numbersCalc.selectedId===tokenId){ numbersCalc.selectedId=null; render(); return; }
  if(numbersCalc.secondId===tokenId){ numbersCalc.secondId=null; render(); return; }
  if(numbersCalc.selectedId===null){ numbersCalc.selectedId=tokenId; render(); return; }
  if(numbersCalc.secondId===null){ numbersCalc.secondId=tokenId; render(); return; }
  numbersCalc.secondId = tokenId; // already had two selected - swap the second choice
  render();
}

function onNumbersOperatorClick(op){
  if(!numbersCalc || !numbersCalc.selectedId || !numbersCalc.secondId) return;
  const tokA = numbersCalc.pool.find(t=>t.id===numbersCalc.selectedId);
  const tokB = numbersCalc.pool.find(t=>t.id===numbersCalc.secondId);
  if(!tokA || !tokB || !numbersOpValid(op, tokA.value, tokB.value)) return;
  const resultValue = numbersApplyOp(op, tokA.value, tokB.value);
  const newTok = {id:'r'+Math.random().toString(36).slice(2,8), value:resultValue, isResult:true};
  numbersCalc.pool = numbersCalc.pool.filter(t=>t.id!==tokA.id && t.id!==tokB.id);
  numbersCalc.pool.push(newTok);
  // Show the expression in the direction that actually produced the result (subtraction/division
  // are order-independent to pick, but the displayed math has to match what really happened).
  let left = tokA.value, right = tokB.value;
  if(op==='-' && tokA.value < tokB.value){ left = tokB.value; right = tokA.value; }
  if(op==='÷' && !(tokB.value>0 && tokA.value%tokB.value===0)){ left = tokB.value; right = tokA.value; }
  numbersCalc.history.push(`${left} ${op} ${right} = ${resultValue}`);
  numbersCalc.lastResultId = newTok.id;
  numbersCalc.selectedId = null;
  numbersCalc.secondId = null;
  sfxSelect();
  render();
}

function onNumbersSubmit(){
  stopNumbersTimer();
  const lastTok = numbersCalc && numbersCalc.lastResultId ? numbersCalc.pool.find(t=>t.id===numbersCalc.lastResultId) : null;
  const value = lastTok ? lastTok.value : null;
  const steps = numbersCalc ? pruneNumbersSteps(numbersCalc.history, value) : [];
  const solver = game.currentSolver();
  game.submitAnswer(solver.id, value, steps);
  numbersCalc = null;
  numbersTurnStarted = false;
  render();
  maybeRunNumbersBotStep();
}

function maybeRunNumbersBotStep(){
  if(!game || game.gameOver) return;
  if(game.phase==='picking'){
    const picker = game.getPlayer(game.pickerId);
    if(!picker.isBot) return;
    setTimeout(()=>{
      if(!game || game.phase!=='picking') return;
      const n = Math.floor(Math.random()*5); // 0-4
      game.chooseNumbers(n);
      stopNumbersTimer();
      startNumbersCalc();
      numbersTurnStarted = false;
      render();
      maybeRunNumbersBotStep();
    }, 800);
  } else if(game.phase==='solving'){
    const solver = game.currentSolver();
    if(!solver.isBot) return;
    setTimeout(()=>{
      if(!game || game.phase!=='solving') return;
      const best = solveCountdownNumbers(game.numbers.map(n=>n.value), game.target);
      game.submitAnswer(solver.id, best.value===game.target||best.value!==null ? best.value : null, best.steps);
      numbersCalc = null;
      render();
      maybeRunNumbersBotStep();
    }, 1400);
  }
}

async function createNumbersOnlineRoom(hostName){
  if(!hasSharedStorage()){ alert("Couldn't connect to the game server. Check your internet connection and try again."); return; }
  const code = generateRoomCode();
  const seatId = 'p_'+myDeviceId.slice(4,9);
  const room = {
    gameType: 'numbers', version: 1, phase: 'lobby', hostDeviceId: myDeviceId, code,
    timeLimit: numbersTimeLimit,
    lobbySeats: [ {id:seatId, name:(hostName||'Host').slice(0,20), deviceId:myDeviceId} ],
  };
  const result = await storageSetSafe(pigRoomKey(code), JSON.stringify(room), true);
  if(!result){ alert('Could not create the room — check your connection and try again.'); return; }
  onlineMode = true; onlineRoomCode = code; onlineIsHost = true; onlineRoomState = room;
  activeGameId = 'numbers-online';
  startOnlinePolling();
  render();
}

async function joinNumbersOnlineRoom(codeRaw, guestName){
  if(!hasSharedStorage()){ alert("Couldn't connect to the game server. Check your internet connection and try again."); return; }
  const code = (codeRaw||'').trim().toUpperCase();
  if(!code){ alert('Enter a room code.'); return; }
  const res = await storageGetSafe(pigRoomKey(code), true);
  if(!res){ alert("Couldn't find a room with that code — double check it with your friend."); return; }
  let room;
  try{ room = JSON.parse(res.value); } catch(e){ alert('That room looks corrupted — ask your friend to create a new one.'); return; }
  if(room.gameType!=='numbers'){ alert('That code belongs to a different game.'); return; }
  if(room.phase !== 'lobby'){ alert('That game has already started.'); return; }
  if(!room.lobbySeats.some(s=>s.deviceId===myDeviceId)){
    if(room.lobbySeats.length>=maxSeatsForGameType('numbers')){ alert('That room is full.'); return; }
    const seatId = 'p_'+myDeviceId.slice(4,9);
    room.lobbySeats.push({id:seatId, name:(guestName||'Player').slice(0,20), deviceId:myDeviceId});
    room.version = (room.version||1)+1;
    const writeResult = await storageSetSafe(pigRoomKey(code), JSON.stringify(room), true);
    if(!writeResult){ alert('Could not join right now — try again.'); return; }
  }
  onlineMode = true; onlineRoomCode = code; onlineIsHost = (room.hostDeviceId===myDeviceId); onlineRoomState = room;
  activeGameId = 'numbers-online';
  startOnlinePolling();
  render();
}

async function startNumbersOnlineGame(){
  if(!onlineIsHost || !onlineRoomState) return;
  await refreshOnlineRoomState();
  const seats = onlineRoomState.lobbySeats;
  if(seats.length<2){ alert('Need at least 2 players to start.'); render(); return; }
  const g = onlineNumbersInit(seats.map(s=>({id:s.id, name:s.name, deviceId:s.deviceId})), onlineRoomState.timeLimit || 30);
  onlineNumbersStartRound(g);
  const newRoom = { ...onlineRoomState, phase:'playing', version: onlineRoomState.version+1, game: g };
  const writeResult = await storageSetSafe(pigRoomKey(onlineRoomCode), JSON.stringify(newRoom), true);
  if(!writeResult){ alert('Could not start the game — try again.'); return; }
  onlineRoomState = newRoom;
  render();
}

async function restartNumbersOnlineGame(){
  if(!onlineIsHost || !onlineRoomState) return;
  await refreshOnlineRoomState();
  const newRoom = { ...onlineRoomState, phase:'lobby', version: onlineRoomState.version+1, game:null };
  const writeResult = await storageSetSafe(pigRoomKey(onlineRoomCode), JSON.stringify(newRoom), true);
  if(writeResult){ onlineRoomState = newRoom; render(); }
}

async function writeNumbersOnlineState(g){
  const newRoom = { ...onlineRoomState, version: onlineRoomState.version+1, game: g };
  const writeResult = await storageSetSafe(pigRoomKey(onlineRoomCode), JSON.stringify(newRoom), true);
  if(writeResult){ onlineRoomState = newRoom; render(); }
  else { render(); }
}

async function onlineNumbersChoosePick(largeCount){
  await refreshOnlineRoomState();
  const g = onlineRoomState.game;
  if(!g || g.phase!=='picking') { render(); return; }
  const me = g.players.find(p=>p.deviceId===myDeviceId);
  if(!me || me.id!==g.pickerId){ render(); return; }
  onlineNumbersChooseNumbers(g, largeCount);
  stopNumbersTimer();
  startNumbersCalc(g.numbers, g.timeLimit);
  numbersTurnStarted = true;
  startNumbersTimer();
  await writeNumbersOnlineState(g);
}

async function onlineNumbersSubmitAnswer(){
  if(!onlineRoomState || !onlineRoomState.game) return;
  stopNumbersTimer();
  const value = numbersCalc && numbersCalc.lastResultId ? numbersCalc.pool.find(t=>t.id===numbersCalc.lastResultId).value : null;
  const steps = numbersCalc ? pruneNumbersSteps(numbersCalc.history, value) : [];
  await refreshOnlineRoomState();
  const g = onlineRoomState.game;
  const me = g.players.find(p=>p.deviceId===myDeviceId);
  if(!me || g.submissions[me.id]!==undefined){ render(); return; }
  onlineNumbersSubmit(g, me.id, value, steps);
  if(value!==null && value===g.target) sfxWin();
  numbersCalc = null;
  await writeNumbersOnlineState(g);
}

function maybeDriveOnlineNumbersPoll(){
  if(!onlineMode || !onlineRoomState || onlineRoomState.phase!=='playing' || !onlineRoomState.game) return;
  if(onlineRoomState.gameType!=='numbers') return;
  const g = onlineRoomState.game;
  if(g.gameOver || g.phase!=='solving') return;
  // Safety net only: if the round has clearly overrun its time limit (e.g. someone's device
  // dropped and never submitted), the host force-resolves it so the game doesn't just hang.
  if(onlineIsHost && g.roundStartAt && (Date.now()-g.roundStartAt) > (g.timeLimit*1000+6000)){
    onlineNumbersMaybeFinishRound(g);
    if(g.phase==='reveal') writeNumbersOnlineState(g);
  }
}

}

function renderNumbersOnlinePicking(el, g){
  const main = renderNumbersOnlineTopbar(el, `Numbers — Round ${g.roundNum} · Room ${onlineRoomState.code}`, g);
  const picker = g.players.find(p=>p.id===g.pickerId);
  const isMe = picker.deviceId===myDeviceId;
  const wrap = document.createElement('div');
  wrap.style.cssText = 'padding:20px;text-align:center;';
  wrap.innerHTML = `
    <div class="menu-eyebrow">${picker.name}'s pick</div>
    <h2 class="display" style="margin:4px 0 6px;">How many large numbers?</h2>
    <p style="font-size:13px;color:#cfe4da;opacity:.8;">Large numbers are 25, 50, 75, 100 — the rest will be small numbers (1–10).</p>
    <div class="numbers-large-choice"></div>
  `;
  main.appendChild(wrap);
  const choiceRow = wrap.querySelector('.numbers-large-choice');
  if(isMe){
    for(let n=0;n<=4;n++){
      const btn = document.createElement('button');
      btn.className = 'numbers-large-btn';
      btn.innerHTML = `<span class="n">${n}</span>large, ${6-n} small`;
      btn.addEventListener('click', ()=>{ sfxSelect(); onlineNumbersChoosePick(n); });
      choiceRow.appendChild(btn);
    }
  } else {
    const waiting = document.createElement('div');
    waiting.style.cssText = 'margin-top:16px;font-size:13px;color:#cfe4da;opacity:.75;';
    waiting.textContent = `${picker.name} is picking…`;
    choiceRow.appendChild(waiting);
  }
  return el;
}

function renderNumbersOnlineSolving(el, g){
  const main = renderNumbersOnlineTopbar(el, `Numbers — Room ${onlineRoomState.code}`, g);
  const me = g.players.find(p=>p.deviceId===myDeviceId);
  const alreadySubmitted = me && g.submissions[me.id]!==undefined;

  if(!me){
    const wrap = document.createElement('div');
    wrap.style.cssText = 'padding:30px;text-align:center;';
    wrap.innerHTML = `<div class="numbers-target">Target<span class="target-value">${g.target}</span></div><p style="font-size:13px;color:#cfe4da;opacity:.75;">Spectating.</p>`;
    main.appendChild(wrap);
    return el;
  }

  if(alreadySubmitted){
    const submittedCount = g.players.filter(p=>g.submissions[p.id]!==undefined).length;
    const wrap = document.createElement('div');
    wrap.style.cssText = 'padding:30px;text-align:center;';
    wrap.innerHTML = `
      <div class="numbers-target">Target<span class="target-value">${g.target}</span></div>
      <p style="font-size:14px;color:var(--gold-bright);margin-top:14px;">You submitted ${g.submissions[me.id].value!==null?g.submissions[me.id].value:'no answer'}.</p>
      <p style="font-size:13px;color:#cfe4da;opacity:.75;">Waiting on ${g.players.length-submittedCount} more player${g.players.length-submittedCount!==1?'s':''}…</p>
    `;
    main.appendChild(wrap);
    return el;
  }

  if(!numbersCalc || numbersCalc.forNumbers !== numbersSignature(g.numbers)){
    stopNumbersTimer();
    startNumbersCalc(g.numbers, g.timeLimit);
    numbersTurnStarted = false;
  }
  if(!numbersTurnStarted){
    const wrap = document.createElement('div');
    wrap.className = 'privacy-shield';
    wrap.style.position = 'static';
    wrap.style.minHeight = '300px';
    wrap.innerHTML = `
      <div class="display">Ready?</div>
      <div style="opacity:.75;font-size:13px;">You'll have ${g.timeLimit} seconds once you start — everyone's racing on the same numbers.</div>
      <button class="primary-btn" style="width:auto;padding:12px 26px;">Start my ${g.timeLimit} seconds</button>
    `;
    wrap.querySelector('button').addEventListener('click', ()=>{
      numbersTurnStarted = true;
      startNumbersTimer();
      render();
    });
    main.appendChild(wrap);
    return el;
  }

  const wrap = document.createElement('div');
  wrap.style.cssText = 'padding:16px;';
  wrap.innerHTML = `
    <div class="numbers-timer${numbersCalc.timeLeft<=10?' low':''}">${numbersCalc.timeLeft}s</div>
    <div class="numbers-target">Target<span class="target-value">${g.target}</span></div>
    <div class="numbers-pool"></div>
    <div class="numbers-op-row"></div>
    <div class="numbers-current-value"></div>
    <div class="numbers-history"></div>
    <div style="display:flex;gap:12px;justify-content:center;margin-top:14px;">
      <button class="ghost-btn" id="numbersResetBtn">Reset</button>
      <button class="primary-btn" id="numbersSubmitBtn" style="width:auto;padding:12px 26px;margin-top:0;">Submit</button>
    </div>
  `;
  main.appendChild(wrap);

  const poolRow = wrap.querySelector('.numbers-pool');
  numbersCalc.pool.forEach(tok=>{
    const tEl = document.createElement('div');
    tEl.className = 'numbers-token' + ((tok.id===numbersCalc.selectedId||tok.id===numbersCalc.secondId)?' selected':'') + (tok.isResult?' result':'');
    tEl.textContent = tok.value;
    tEl.addEventListener('click', ()=> onNumbersTokenClick(tok.id));
    poolRow.appendChild(tEl);
  });
  const opRow = wrap.querySelector('.numbers-op-row');
  const tokA = numbersCalc.selectedId ? numbersCalc.pool.find(t=>t.id===numbersCalc.selectedId) : null;
  const tokB = numbersCalc.secondId ? numbersCalc.pool.find(t=>t.id===numbersCalc.secondId) : null;
  ['+','-','×','÷'].forEach(op=>{
    const btn = document.createElement('button');
    btn.className = 'numbers-op-btn';
    btn.textContent = op;
    btn.disabled = !(tokA && tokB && numbersOpValid(op, tokA.value, tokB.value));
    btn.addEventListener('click', ()=> onNumbersOperatorClick(op));
    opRow.appendChild(btn);
  });
  const currentValueEl = wrap.querySelector('.numbers-current-value');
  const lastTok = numbersCalc.lastResultId ? numbersCalc.pool.find(t=>t.id===numbersCalc.lastResultId) : null;
  currentValueEl.textContent = lastTok ? 'Current best: ' : (numbersCalc.history.length===0 ? 'Combine two numbers to begin' : '');
  if(lastTok){ const span=document.createElement('span'); span.className='val'; span.textContent=lastTok.value; currentValueEl.appendChild(span); }
  const historyEl = wrap.querySelector('.numbers-history');
  numbersCalc.history.forEach(line=>{ const d=document.createElement('div'); d.textContent=line; historyEl.appendChild(d); });

  wrap.querySelector('#numbersResetBtn').addEventListener('click', ()=>{
    const timeLeft = numbersCalc.timeLeft;
    stopNumbersTimer();
    startNumbersCalc(g.numbers, g.timeLimit);
    numbersCalc.timeLeft = timeLeft;
    startNumbersTimer();
    render();
  });
  wrap.querySelector('#numbersSubmitBtn').addEventListener('click', ()=> onlineNumbersSubmitAnswer());
  return el;
}

function renderNumbersOnlineReveal(el, g){
  const main = renderNumbersOnlineTopbar(el, `Numbers — Round ${g.roundNum} results`, g);
  const wrap = document.createElement('div');
  wrap.style.cssText = 'padding:20px;';
  wrap.innerHTML = `
    <div style="text-align:center;margin-bottom:10px;">
      <div class="menu-eyebrow">Target was</div>
      <div class="numbers-target"><span class="target-value">${g.target}</span></div>
      <div style="font-size:13px;color:#cfe4da;opacity:.85;">Numbers: ${g.numbers.map(n=>n.value).join(', ')}</div>
    </div>
    <div class="numbers-reveal-list" style="max-width:420px;margin:18px auto;"></div>
    ${g.bestPossible ? `<div style="text-align:center;font-size:13px;color:#cfe4da;opacity:.85;margin-top:10px;"><div>Best possible: <strong style="color:var(--gold-bright);">${g.bestPossible.value}</strong></div><div style="margin-top:4px;font-size:12px;opacity:.85;">${numbersStepsHTML(g.bestPossible.steps)}</div></div>` : ''}
    <div style="text-align:center;margin-top:20px;">${onlineIsHost ? '<button class="primary-btn" id="nextRoundBtn" style="width:auto;padding:14px 26px;">Next round</button>' : '<p style="font-size:13px;color:#cfe4da;opacity:.75;">Waiting for the host to continue…</p>'}</div>
  `;
  main.appendChild(wrap);
  const list = wrap.querySelector('.numbers-reveal-list');
  [...g.players].sort((a,b)=>(b.lastRoundPoints||0)-(a.lastRoundPoints||0)).forEach(p=>{
    const row = document.createElement('div');
    row.className = 'numbers-reveal-row';
    const stepsHTML = p.lastRoundExpr && p.lastRoundExpr.length ? `<div style="font-size:11px;opacity:.75;margin-top:2px;">${numbersStepsHTML(p.lastRoundExpr)}</div>` : '';
    const valueText = p.lastRoundValue!==null ? `<div>${p.lastRoundValue}</div>${stepsHTML}` : 'No answer';
    row.innerHTML = `
      <span>${p.name}${p.deviceId===myDeviceId?' (you)':''}</span>
      <span style="flex:1;text-align:center;font-size:12px;color:#cfe4da;opacity:.85;">${valueText}</span>
      <span class="numbers-points-pill${(p.lastRoundPoints||0)===0?' zero':''}">${p.lastRoundPoints||0} pt${(p.lastRoundPoints||0)!==1?'s':''}</span>
    `;
    list.appendChild(row);
  });
  if(onlineIsHost){
    wrap.querySelector('#nextRoundBtn').addEventListener('click', async ()=>{
      await refreshOnlineRoomState();
      const g2 = onlineRoomState.game;
      onlineNumbersStartRound(g2);
      await writeNumbersOnlineState(g2);
    });
  }
  return el;
}

function renderNumbersOnlineGameOver(el, g){
  const winners = g.winner || [];
  const title = winners.length===1 ? `${winners[0].name} wins!` : `${winners.map(w=>w.name).join(' & ')} tie!`;
  const rows = [...g.players].sort((a,b)=>b.score-a.score)
    .map(p=>`<tr><td>${p.name}${winners.some(w=>w.id===p.id)?' 🏆':''}${p.deviceId===myDeviceId?' (you)':''}</td><td>${p.score}</td></tr>`).join('');
  const logHTML = [...g.log].slice(-60).reverse().map(line=>`<div>${line}</div>`).join('');
  el.innerHTML = `
    <div class="menu-screen">
      <div class="menu-eyebrow">Game over</div>
      <h1 class="menu-title">${title}</h1>
      <p class="menu-sub">Room ${onlineRoomState.code}.</p>
      <div style="width:100%;max-width:420px;text-align:left;margin:14px 0 22px;">
        <h3 style="font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--gold-bright);margin:0 0 10px;">Final scores</h3>
        <table class="round-results" style="width:100%;">
          <tr><th>Player</th><th>Points</th></tr>
          ${rows}
        </table>
      </div>
      <div style="width:100%;max-width:420px;text-align:left;margin:0 0 28px;">
        <h3 style="font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--gold-bright);margin:0 0 10px;">Table talk</h3>
        <div style="max-height:220px;overflow-y:auto;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px 14px;font-size:12px;color:#cfe4da;opacity:.9;display:flex;flex-direction:column;gap:5px;">
          ${logHTML}
        </div>
      </div>
      <div style="display:flex;gap:14px;">
        ${onlineIsHost ? '<button class="primary-btn" id="rematchBtn" style="width:auto;padding:14px 26px;">Back to lobby</button>' : ''}
        <button class="ghost-btn" id="menuBtn2">Leave</button>
      </div>
    </div>
  `;
  if(onlineIsHost){
    el.querySelector('#rematchBtn').addEventListener('click', ()=> restartNumbersOnlineGame());
  }
  el.querySelector('#menuBtn2').addEventListener('click', ()=>{ stopNumbersTimer(); leaveOnlineGame(); });
  return el;
}

render();
</script>
</body>
</html>
