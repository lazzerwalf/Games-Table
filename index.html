  {id:'pairs', name:'Pairs', active:true, icon:'🂡🂱', desc:'Flip two cards to find a match. Matches score a point and earn you another go.'},
  {id:'sevens', name:"7's", active:true, icon:'♣7♦', desc:'Every 7 starts a run. Build each suit up and down from there. First to empty their hand wins.'},
  {id:'bonk', name:'BONK', active:true, icon:'💥5️⃣', desc:'Any card goes. Match the last rank played and BONK the player who laid it — do it again and again to escalate.'},
  {id:'trumps', name:'Trumps', active:true, icon:'♠️👑', desc:"Follow suit or trump it. Win no tricks in a round and you're out — last player standing wins."},
  {id:'numbers', name:'Numbers', active:true, icon:'🔢', desc:'Pick large and small numbers, then get as close as you can to a random target using +, −, ×, ÷.'},
];

function render(){
  if(activeGameId==='greedypig-online'){
    app.innerHTML=''; app.appendChild(renderGreedyPigOnlineScreen());
    return;
  }
  if(activeGameId==='pairs-online'){
    app.innerHTML=''; app.appendChild(renderPairsOnlineScreen());
    return;
  }
  if(activeGameId==='black5-online'){
    app.innerHTML=''; app.appendChild(renderBlack5OnlineScreen());
    return;
  }
  if(activeGameId==='sevens-online'){
    app.innerHTML=''; app.appendChild(renderSevensOnlineScreen());
    return;
  }
  if(activeGameId==='bonk-online'){
    app.innerHTML=''; app.appendChild(renderBonkOnlineScreen());
    return;
  }
  if(activeGameId==='numbers-online'){
    app.innerHTML=''; app.appendChild(renderNumbersOnlineScreen());
    return;
  }
  if(!game){
    app.innerHTML = '';
    app.appendChild(revealedForId==='menu-setup' ? renderSetup() : renderMenu());
    return;
  }
  app.innerHTML='';
  if(activeGameId==='greedypig') app.appendChild(renderGreedyPigScreen());
  else if(activeGameId==='pairs') app.appendChild(renderPairsScreen());
  else if(activeGameId==='sevens') app.appendChild(renderSevensScreen());
  else if(activeGameId==='bonk') app.appendChild(renderBonkScreen());
  else if(activeGameId==='trumps') app.appendChild(renderTrumpsScreen());
  else if(activeGameId==='numbers') app.appendChild(renderNumbersScreen());
  else app.appendChild(renderGame());
}

/* ---------- MENU ---------- */
function renderMenu(){
  const el = document.createElement('div');
  el.className = 'menu-screen';
  el.innerHTML = `
    <div class="menu-eyebrow">Games Table</div>
    <h1 class="menu-title">Pick a game</h1>
    <div class="game-grid"></div>
  `;
  const grid = el.querySelector('.game-grid');
  GAMES.forEach(g=>{
    const tile = document.createElement('div');
    tile.className = 'game-tile ' + (g.active ? 'active' : 'locked');
    tile.innerHTML = `
      ${g.active? '<div class="tile-badge">Ready</div>' : '<div class="tile-badge">Coming soon</div>'}
      <div class="tile-suits">${g.icon}</div>
      <div class="tile-name">${g.name}</div>
      <div class="tile-desc">${g.desc}</div>
    `;
    if(g.active){
      tile.addEventListener('click', ()=>{ pendingGameId = g.id; setupTab='setup'; revealedForId='menu-setup'; render(); });
    }
    grid.appendChild(tile);
  });
  return el;
}

/* ---------- SETUP ---------- */
function renderSetup(){
  if(pendingGameId==='numbers') return renderNumbersSetup();
  if(seatConfigs.length===0){
    seatConfigs = [
      {id:'p1', name:'You', isBot:false},
      {id:'p2', name:'Bot Beau', isBot:true},
      {id:'p3', name:'Bot Cleo', isBot:true},
      {id:'p4', name:'Bot Dex', isBot:true},
      {id:'p5', name:'Bot Finn', isBot:true},
      {id:'p6', name:'Bot Gwen', isBot:true},
    ];
  }
  const gameMeta = GAMES.find(g=>g.id===pendingGameId);
  const seatOptions = pendingGameId==='pairs' ? [2,3,4,5,6] : pendingGameId==='sevens' ? [3,4,5,6] : pendingGameId==='bonk' ? [2,3,4,5,6] : [2,3,4];
  let seatCount = Math.max(seatOptions[0], Math.min(seatConfigs._count || seatOptions[0], seatOptions[seatOptions.length-1]));

  const el = document.createElement('div');
  el.className = 'setup-screen';
  el.innerHTML = `
    <div class="setup-card">
      <button class="back-link">&larr; Back to games</button>
      <h2 class="display" style="margin-top:0;">${gameMeta.name}</h2>
      <div class="setup-tabs">
        <button class="setup-tab-btn ${setupTab==='setup'?'active':''}" data-tab="setup">Table setup</button>
        <button class="setup-tab-btn ${setupTab==='rules'?'active':''}" data-tab="rules">Rules</button>
      </div>
      <div class="tab-body"></div>
    </div>
  `;
  const backBtn = el.querySelector('.back-link');
  backBtn.addEventListener('click', ()=>{ revealedForId=null; render(); });

  el.querySelectorAll('.setup-tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{ setupTab = btn.dataset.tab; render(); });
  });

  const tabBody = el.querySelector('.tab-body');

  if(setupTab==='rules'){
    const rulesPanel = pendingGameId==='greedypig' ? renderGreedyPigRulesPanel()
      : pendingGameId==='pairs' ? renderPairsRulesPanel()
      : pendingGameId==='sevens' ? renderSevensRulesPanel()
      : pendingGameId==='bonk' ? renderBonkRulesPanel()
      : pendingGameId==='trumps' ? renderTrumpsRulesPanel()
      : pendingGameId==='numbers' ? renderNumbersRulesPanel()
      : renderRulesPanel();
    tabBody.appendChild(rulesPanel);
    return el;
  }

  if(['greedypig','pairs','black5','sevens','bonk'].includes(pendingGameId)){
    const modeRow = document.createElement('div');
    modeRow.style.cssText = 'display:flex;gap:8px;margin-bottom:18px;';
    modeRow.innerHTML = `
      <button class="count-btn ${onlinePlayMode==='local'?'selected':''}" data-mode="local" style="flex:1;">Local (bots / pass-around)</button>
      <button class="count-btn ${onlinePlayMode==='online'?'selected':''}" data-mode="online" style="flex:1;">Online (different phones)</button>
    `;
    tabBody.appendChild(modeRow);
    modeRow.querySelectorAll('button').forEach(b=>{
      b.addEventListener('click', ()=>{ onlinePlayMode = b.dataset.mode; render(); });
    });
    if(onlinePlayMode==='online'){
      const panel = pendingGameId==='greedypig' ? renderGreedyPigOnlineSetupPanel()
        : pendingGameId==='pairs' ? renderPairsOnlineSetupPanel()
        : pendingGameId==='sevens' ? renderSevensOnlineSetupPanel()
        : pendingGameId==='bonk' ? renderBonkOnlineSetupPanel()
        : renderBlack5OnlineSetupPanel();
      tabBody.appendChild(panel);
      return el;
    }
  }

  const noteText = pendingGameId==='greedypig'
    ? '2–4 players. Roll and bank your luck — first to 101 points wins.'
    : pendingGameId==='pairs'
    ? '2–6 players. Find matching pairs on the board — most pairs when the board is cleared wins.'
    : pendingGameId==='sevens'
    ? '3–6 players. All the cards are dealt out — first to empty your hand wins.'
    : pendingGameId==='bonk'
    ? '2–6 players. Everyone starts with 5 lives. Match the last card played and BONK whoever laid it — last one standing wins.'
    : pendingGameId==='trumps'
    ? "2–4 players. Follow suit if you can, or trump it. Win no tricks in a round and you're out — last one standing wins."
    : pendingGameId==='numbers'
    ? '2–6 players. Pick your numbers, then get as close as you can to the target in 30 seconds. Highest score wins.'
    : '2–4 players. Everyone starts with 5 points; you lose points based on the cards left in your hand when a round ends.';
  const startLabel = pendingGameId==='greedypig' ? 'Start rolling' : pendingGameId==='pairs' ? 'Lay the board' : pendingGameId==='sevens' ? 'Deal everyone in' : pendingGameId==='bonk' ? 'Deal the cards' : pendingGameId==='trumps' ? 'Deal the cards' : pendingGameId==='numbers' ? 'Start the game' : 'Deal the cards';

  const setupWrap = document.createElement('div');
  setupWrap.innerHTML = `
    <div class="rules-note" style="margin-top:-6px;margin-bottom:16px;">${noteText}</div>
    ${pendingGameId==='pairs' ? '<div class="pack-count-row"></div>' : ''}
    <div class="seat-count-row"></div>
    <div class="seats-list"></div>
    <button class="primary-btn">${startLabel}</button>
  `;
  tabBody.appendChild(setupWrap);

  if(pendingGameId==='pairs'){
    const packRow = setupWrap.querySelector('.pack-count-row');
    const packCount = seatConfigs._packCount || 1;
    const packLabel = document.createElement('div');
    packLabel.style.cssText = 'font-size:12px;color:var(--gold-bright);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;';
    packLabel.textContent = 'Packs of cards';
    packRow.appendChild(packLabel);
    const btnRow = document.createElement('div');
    btnRow.style.cssText = 'display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;';
    [1,2,3].forEach(n=>{
      const b = document.createElement('button');
      b.className = 'count-btn' + (n===packCount ? ' selected' : '');
      b.textContent = n===1 ? '1 pack' : n + ' packs';
      b.addEventListener('click', ()=>{ seatConfigs._packCount = n; render(); });
      btnRow.appendChild(b);
    });
    packRow.appendChild(btnRow);
  }

  const countRow = setupWrap.querySelector('.seat-count-row');
  seatOptions.forEach(n=>{
    const b = document.createElement('button');
    b.className = 'count-btn' + (n===seatCount ? ' selected' : '');
    b.textContent = n + ' players';
    b.addEventListener('click', ()=>{ seatConfigs._count = n; render(); });
    countRow.appendChild(b);
  });

  const seatsList = setupWrap.querySelector('.seats-list');
  for(let i=0;i<seatCount;i++){
    const seat = seatConfigs[i];
    const row = document.createElement('div');
    row.className = 'seat-row';
    row.innerHTML = `
      <div class="seat-label">Seat ${i+1}</div>
      <input class="seat-name-input" value="${seat.name}" maxlength="16" />
      <div class="toggle-group">
        <button class="toggle-btn ${!seat.isBot?'on':''}" data-role="human">Human</button>
        <button class="toggle-btn ${seat.isBot?'on':''}" data-role="bot">Bot</button>
      </div>
    `;
    const input = row.querySelector('.seat-name-input');
    input.addEventListener('input', ()=>{ seat.name = input.value || `Seat ${i+1}`; });
    row.querySelectorAll('.toggle-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        seat.isBot = btn.dataset.role==='bot';
        render();
      });
    });
    seatsList.appendChild(row);
  }

  const startBtn = setupWrap.querySelector('.primary-btn');
  startBtn.addEventListener('click', ()=>{
    const defs = seatConfigs.slice(0, seatCount).map(s=>({id:s.id, name:s.name || 'Player', isBot:s.isBot}));
    if(pendingGameId==='greedypig'){
      game = new GreedyPigGame(defs);
      activeGameId = 'greedypig';
      revealedForId = null;
    } else if(pendingGameId==='pairs'){
      game = new PairsGame(defs, seatConfigs._packCount || 1);
      activeGameId = 'pairs';
      revealedForId = null;
    } else if(pendingGameId==='sevens'){
      game = new SevensGame(defs);
      game.dealAndStart();
      activeGameId = 'sevens';
      revealedForId = defs.filter(d=>!d.isBot).length<=1 ? (defs.find(d=>!d.isBot)?.id || null) : null;
    } else if(pendingGameId==='bonk'){
      game = new BonkGame(defs);
      game.startRound();
      activeGameId = 'bonk';
      revealedForId = defs.filter(d=>!d.isBot).length<=1 ? (defs.find(d=>!d.isBot)?.id || null) : null;
    } else if(pendingGameId==='trumps'){
      game = new TrumpsGame(defs);
      game.startRound();
      activeGameId = 'trumps';
      revealedForId = defs.filter(d=>!d.isBot).length<=1 ? (defs.find(d=>!d.isBot)?.id || null) : null;
    } else if(pendingGameId==='numbers'){
      game = new CountdownNumbersGame(defs);
      game.startRound();
      activeGameId = 'numbers';
      revealedForId = defs.filter(d=>!d.isBot).length<=1 ? (defs.find(d=>!d.isBot)?.id || null) : null;
    } else {
      game = new BlackFiveGame(defs);
      game.startRound();
      announcedLastCard = new Set();
      activeGameId = 'black5';
      revealedForId = defs.filter(d=>!d.isBot).length<=1 ? (defs.find(d=>!d.isBot)?.id || null) : null;
    }
    render();
    if(activeGameId==='greedypig') maybeRunGreedyPigBotTurn();
    else if(activeGameId==='pairs') maybeRunPairsBotTurn();
    else if(activeGameId==='sevens') maybeRunSevensBotTurn();
    else if(activeGameId==='bonk') maybeRunBonkBotTurn();
    else if(activeGameId==='trumps') maybeRunTrumpsBotTurn();
    else if(activeGameId==='numbers') maybeRunNumbersBotStep();
    else maybeRunBotTurn();
  });

  return el;
}

/* ---------- GAME ---------- */
function humanPlayers(){ return game.players.filter(p=>!p.isBot); }

function renderRulesPanel(){
  const wrap = document.createElement('div');
  wrap.className = 'rules-content';
  wrap.innerHTML = `
    <h4>Setup</h4>
    <p>2–4 players. Everyone is dealt 5 cards, and one card is flipped to start the pile. One player is the dealer; the player to the dealer's left plays first, and turns go clockwise.</p>

    <h4>Playing a card</h4>
    <p>On your turn, play a card that matches the suit or rank of the top card, or play any Ace. If you can't, you draw a card and your turn ends.</p>

    <h4>Card effects</h4>
    <ul>
      <li><strong>Ace</strong> — wild. Choose the new suit for everyone to follow.</li>
      <li><strong>2</strong> — the next player draws 2, unless they play a 2 themselves, which stacks it +2 onto the following player.</li>
      <li><strong>8</strong> — you must play again straight after it, following the normal suit/rank rules. If you can't, you draw a card instead.</li>
      <li><strong>Jack</strong> — the next player is skipped, unless they play a Jack themselves, which passes the skip on to the next player instead.</li>
      <li><strong>Same-suit run</strong> — if the card you just played is the same suit and exactly one rank higher than the card before it (e.g. a 5 on a 4, both spades), you must play again, same as an 8. If you can't, you draw instead.</li>
    </ul>

    <h4>The starting card</h4>
    <p>Whatever's flipped to start a round has its effect too, as if it had just been played:</p>
    <ul>
      <li><strong>Ace</strong> — the dealer calls the suit, then play begins normally.</li>
      <li><strong>2</strong> — the first player must draw 2 or stack a 2.</li>
      <li><strong>Jack</strong> — the first player is on the line to be skipped.</li>
      <li><strong>8</strong> — the dealer takes the very first turn.</li>
    </ul>

    <h4>Scoring</h4>
    <p>Everyone starts with 5 points. The moment someone empties their hand, the round ends. Everyone else adds up the cards left in their hand and loses 1 point for every 10 in that total.</p>
    <ul>
      <li>Number cards are worth their face value.</li>
      <li>Jack, Queen, King are worth 10.</li>
      <li>Ace is worth 11.</li>
    </ul>
    <p>The dealer passes to the next player clockwise each round. A player is out once their score hits 0 or below — last one standing wins.</p>

    <div class="black5-note">
      <strong>Black 5s (5♠ / 5♣)</strong> are the namesake of the game — worth 50 points if caught in your hand when a round ends. That's an instant game over for you, no matter how many points you had left.
    </div>
  `;
  return wrap;
}

function renderGame(){
  const el = document.createElement('div');
  el.className = 'game-screen';

  if(game.gameOver){
    return renderGameOverModal(el);
  }

  const cp = game.currentPlayer();
  const multiHuman = humanPlayers().length > 1;
  const needsShield = multiHuman && !cp.isBot && revealedForId !== cp.id;

  el.innerHTML = `
    <div class="topbar">
      <div class="topbar-title">Black 5 — Round ${game.roundNum}</div>
      <div class="topbar-actions">
        <button id="menuBtn">Main menu</button>
      </div>
    </div>
    <div class="table-area">
      <div class="table-main">
        <div class="opponents-row"></div>
        <div class="center-area"></div>
        <div class="threat-banner"></div>
        <div class="hand-zone">
          <div class="hand-fan"></div>
          <div class="action-row"></div>
        </div>
      </div>
      <details class="side-panel">
        <summary>Scores &amp; Table talk</summary>
        <div class="side-panel-body">
          <h3>Scores</h3>
          <div class="score-list"></div>
          <h3>Table talk</h3>
          <div class="log-feed"></div>
        </div>
      </details>
    </div>
  `;

  el.querySelector('#menuBtn').addEventListener('click', ()=>{
    if(confirm('Leave this game and return to the menu?')){
      game = null; revealedForId=null; seatConfigs=[]; render();
    }
  });

  el.querySelector('.topbar-actions').prepend(renderMuteControl());
  el.querySelector('.topbar-actions').prepend(renderCardScaleControl());

  // opponents
  const oppRow = el.querySelector('.opponents-row');
  game.activePlayers().filter(p=>p.id!==(multiHuman?null:humanPlayers()[0]?.id)).forEach(p=>{
    if(!multiHuman && !p.isBot) return; // skip the single human, they appear in hand zone
    const div = document.createElement('div');
    div.className = 'opponent' + (p.id===cp.id ? ' active-turn' : '');
    div.innerHTML = `
      ${p.id===game.dealerId ? '<div class="dealer-chip">D</div>' : ''}
      <div class="name">${p.name}${p.isBot?' 🤖':''}</div>
      <div class="score">${p.score} pts</div>
      <div class="cardcount">${p.hand.length} card${p.hand.length!==1?'s':''}</div>
    `;
    oppRow.appendChild(div);
  });

  // center
  const center = el.querySelector('.center-area');
  const top = game.topCard();
  const deckStack = document.createElement('div');
  deckStack.className = 'pile-stack deck-pile';
  deckStack.appendChild(makeCardEl({back:true}, 'normal'));
  const deckLabel = document.createElement('div');
  deckLabel.style.cssText='text-align:center;font-size:11px;color:#cfe4da;margin-top:6px;';
  deckLabel.textContent = game.deck.length + ' left';

  const deckWrap = document.createElement('div');
  deckWrap.style.textAlign='center';
  deckWrap.appendChild(deckStack); deckWrap.appendChild(deckLabel);

  const discardWrap = document.createElement('div');
  discardWrap.className = 'discard-pile';
  discardWrap.appendChild(makeCardEl(top,'normal'));

  const suitInd = document.createElement('div');
  suitInd.className = 'suit-indicator';
  suitInd.innerHTML = `<div class="suit-badge ${SUIT_RED[game.activeSuit]?'red':''}">${SUIT_SYM[game.activeSuit]}</div><div>in play</div>`;

  center.appendChild(deckWrap);
  center.appendChild(discardWrap);
  center.appendChild(suitInd);

  // threat banner
  const banner = el.querySelector('.threat-banner');
  if(game.drawPending>0) banner.textContent = `Draw ${game.drawPending} pending — play a 2 to stack it, or take the cards.`;
  else if(game.skipPending) banner.textContent = `A turn is on the line — play a Jack to pass it on, or accept the skip.`;
  else if(game.continuation){
    const cur = game.currentPlayer();
    const hasValid = game.validPlays(cur).length>0;
    banner.textContent = hasValid ? `Play again — you have to lay another valid card.` : `Play again — but no valid card to follow it, so a card must be drawn.`;
  }
  else banner.textContent = '';

  // score list
  const scoreList = el.querySelector('.score-list');
  game.players.forEach(p=>{
    const item = document.createElement('div');
    item.className = 'score-item' + (!p.isBot?' you':'');
    item.innerHTML = `<span>${p.name}${p.eliminated?' (out)':''}</span><span>${p.score} pts</span>`;
    scoreList.appendChild(item);
  });

  // log
  const logFeed = el.querySelector('.log-feed');
  [...game.log].slice(-40).reverse().forEach(line=>{
    const d = document.createElement('div');
    d.textContent = line;
    logFeed.appendChild(d);
  });

  // hand + actions for current human (or the single human always shown)
  const handFan = el.querySelector('.hand-fan');
  const actionRow = el.querySelector('.action-row');
  const displayPlayer = multiHuman ? (needsShield ? null : cp) : humanPlayers()[0];

  if(displayPlayer){
    const isMyTurn = displayPlayer.id === cp.id && !displayPlayer.isBot;
    const valid = isMyTurn ? game.validPlays(displayPlayer).map(c=>c.id) : [];
    const isBonusTurn = isMyTurn && !!game.continuation;

    displayPlayer.hand.forEach(card=>{
      const wrap = document.createElement('div');
      wrap.className = 'hand-card-wrap';
      const clickable = isMyTurn && !uiLock && valid.includes(card.id);
      if(clickable){ wrap.classList.add('playable'); }
      if(isBonusTurn && clickable) wrap.classList.add('chain-glow');
      if(isMyTurn && !valid.includes(card.id)) wrap.classList.add('dim');
      wrap.appendChild(makeCardEl(card,'normal'));
      if(clickable){
        wrap.addEventListener('click', ()=> onPlayCard(displayPlayer.id, card));
      }
      handFan.appendChild(wrap);
    });

    if(isMyTurn && !uiLock){
      if(game.continuation && valid.length===0){
        const btn = document.createElement('button');
        btn.className='ghost-btn';
        btn.textContent = 'No valid plays — draw a card';
        btn.addEventListener('click', ()=>{ sfxDraw(); game.drawOne(displayPlayer.id); afterAction(); });
        actionRow.appendChild(btn);
      } else if(game.continuation && valid.length>0){
        // mandatory extra play — no stop button, just pick one of the highlighted cards
      } else if(game.drawPending>0){
        const btn = document.createElement('button');
        btn.className='ghost-btn danger';
        btn.textContent = `Take ${game.drawPending} cards`;
        btn.addEventListener('click', ()=>{ sfxDraw(); game.resolveDrawPenalty(displayPlayer.id); afterAction(); });
        actionRow.appendChild(btn);
      } else if(game.skipPending){
        const btn = document.createElement('button');
        btn.className='ghost-btn danger';
        btn.textContent = 'Accept the skip';
        btn.addEventListener('click', ()=>{ sfxPass(); game.resolveSkipPenalty(displayPlayer.id); afterAction(); });
        actionRow.appendChild(btn);
      } else if(valid.length===0){
        const btn = document.createElement('button');
        btn.className='ghost-btn';
        btn.textContent = 'No valid plays — draw a card';
        btn.addEventListener('click', ()=>{ sfxDraw(); game.drawOne(displayPlayer.id); afterAction(); });
        actionRow.appendChild(btn);
      }
    }
  }

  // privacy shield
  if(needsShield){
    const shield = document.createElement('div');
    shield.className = 'privacy-shield';
    shield.innerHTML = `
      <div class="display">Pass the device to ${cp.name}</div>
      <div style="opacity:.75;font-size:13px;">Everyone else, look away.</div>
      <button class="primary-btn" style="width:auto;padding:12px 26px;">I'm ${cp.name} — reveal my hand</button>
    `;
    shield.querySelector('button').addEventListener('click', ()=>{ revealedForId = cp.id; render(); });
    el.querySelector('.table-main').style.position='relative';
    el.querySelector('.table-main').appendChild(shield);
  }

  // suit choice modal
  if(game.awaitingSuitChoice && !cp.isBot){
    el.appendChild(renderSuitModal());
  }

  // round result modal
  if(game.roundResult && !game._roundResultShown){
    el.appendChild(renderRoundResultModal());
  }

  setupSidePanelToggle(el);
  return el;
}

function makeCardEl(card, size){
  const wrap = document.createElement('div');
  if(card.back){
    wrap.className = 'playing-card back' + (size==='mini'?' mini':'');
    return wrap;
  }
  wrap.className = 'playing-card' + (SUIT_RED[card.suit] ? ' red':'') + (size==='mini'?' mini':'');
  wrap.innerHTML = `
    <div class="rank-top">${card.rank}${SUIT_SYM[card.suit]}</div>
    <div class="suit-mid">${SUIT_SYM[card.suit]}</div>
    <div class="rank-bot">${card.rank}${SUIT_SYM[card.suit]}</div>
  `;
  return wrap;
}

function renderSuitModal(){
  const overlay = document.createElement('div');

function handSummaryHTML(hand){
  if(!hand || hand.length===0) return '<span style="opacity:.5;">—</span>';
  return hand.map(c=>{
    if(isBlackFive(c)){
      return `<span style="background:var(--red);color:#fff;font-weight:700;padding:2px 6px;border-radius:5px;margin-right:7px;white-space:nowrap;">${c.rank}${SUIT_SYM[c.suit]}</span>`;
    }
    const color = SUIT_RED[c.suit] ? '#ff9aa8' : 'var(--cream)';
    return `<span style="color:${color};font-weight:600;margin-right:7px;white-space:nowrap;">${c.rank}${SUIT_SYM[c.suit]}</span>`;
  }).join('');
}

/* ---------- toast notifications ---------- */
let announcedLastCard = new Set();

function showToast(message){
  const el = document.createElement('div');
  el.className = 'toast-banner';
  el.textContent = message;
  document.body.appendChild(el);
  requestAnimationFrame(()=> el.classList.add('show'));
  setTimeout(()=>{
    el.classList.remove('show');
    setTimeout(()=> el.remove(), 350);
  }, 2200);
}

// Wraps game.playCard so every play (human or bot) is checked for a "last card" moment.
function doPlay(playerId, cardId, chosenSuit){
  sfxCardPlay();
  const player = game.getPlayer(playerId);
  const result = game.playCard(playerId, cardId, chosenSuit);
  if(player.hand.length===1 && !announcedLastCard.has(playerId)){
    announcedLastCard.add(playerId);
    showToast(`${player.name} is on their last card!`);
  } else if(player.hand.length!==1){
    announcedLastCard.delete(playerId);
  }
  if(game.gameOver) sfxWin();
  return result;
}

/* ---------- interaction handlers ---------- */
function onPlayCard(playerId, card){
  if(uiLock) return;
  let chosenSuit = undefined;
  const result = doPlay(playerId, card.id, chosenSuit);
  if(result.needSuitChoice){ render(); return; }
  afterAction();
}

function afterAction(){
  render();
  maybeRunBotTurn();
}

function maybeRunBotTurn(){
  if(!game || game.gameOver) return;
  if(game.roundResult) return; // waiting on modal
  if(game.awaitingSuitChoice){
    const p = game.currentPlayer();
    if(p.isBot){
      setTimeout(()=>{ game.resolveSuitChoice(game.botChooseSuit(p)); afterAction(); }, 500);
    }
    return;
  }
  const cp = game.currentPlayer();
  if(!cp.isBot) return;
  uiLock = true;
  render();
  setTimeout(()=> runBotTurn(cp), 650);
}

function runBotTurn(bot){
  if(!game || game.gameOver || game.roundResult) { uiLock=false; return; }
  if(game.drawPending>0){
    const twos = bot.hand.filter(c=>c.rank==='2');
    if(twos.length>0 && Math.random()<0.85){
      const r = doPlay(bot.id, twos[0].id);
      continueBotChain(bot, r);
    } else {
      sfxDraw();
      game.resolveDrawPenalty(bot.id);
      uiLock=false; afterAction();
    }
    return;
  }
  if(game.skipPending){
    const jacks = bot.hand.filter(c=>c.rank==='J');
    if(jacks.length>0 && Math.random()<0.85){
      const r = doPlay(bot.id, jacks[0].id);
      continueBotChain(bot, r);
    } else {
      sfxPass();
      game.resolveSkipPenalty(bot.id);
      uiLock=false; afterAction();
    }
    return;
  }
  const valid = game.validPlays(bot);
  if(valid.length===0){
    sfxDraw();
    game.drawOne(bot.id);
    uiLock=false; afterAction();
    return;
  }
  const card = botChooseCard(bot, valid);
  let chosenSuit = card.rank==='A' ? game.botChooseSuit(bot) : undefined;
  const r = doPlay(bot.id, card.id, chosenSuit);
  continueBotChain(bot, r);
}

function botChooseCard(bot, valid){
  // prefer non-action cards first to save 2/J/8/A for strategic moments, unless it's the only play
  const nonAction = valid.filter(c=>!['2','J','8','A'].includes(c.rank));
  const pool = nonAction.length>0 ? nonAction : valid;
  pool.sort((a,b)=> cardValue(b)-cardValue(a));
  return pool[0];
}

function continueBotChain(bot, r){
  if(!game || game.roundResult){ uiLock=false; if(game && game.roundResult) render(); return; }
  if(r.roundEnded){ uiLock=false; render(); return; }
  if(r.continue){
    const valid = game.validPlays(bot);
    if(valid.length===0){
      setTimeout(()=>{ game.drawOne(bot.id); uiLock=false; afterAction(); }, 500);
      return;
    }
    // Both continuation types (an 8's extra play, or a same-suit increment run) are mandatory now.
    setTimeout(()=>{
      const card = botChooseCard(bot, valid);
      const chosenSuit = card.rank==='A' ? game.botChooseSuit(bot) : undefined;
      const rr = doPlay(bot.id, card.id, chosenSuit);
      continueBotChain(bot, rr);
    }, 500);
    return;
  }
  uiLock=false;
  afterAction();
}

/* ======================= PAIRS — ONLINE UI/LOGIC ======================= */
function serializePairsGame(g){
  return {
    players: g.players.map(p=>({id:p.id, name:p.name, isBot:p.isBot, score:p.score, deviceId:p.deviceId||null})),
    packCount: g.packCount,
    board: g.board.map(c => c ? {suit:c.suit, rank:c.rank, id:c.id, faceUp:c.faceUp} : null),
    stock: g.stock.map(c => ({suit:c.suit, rank:c.rank, id:c.id})),
    knownRanks: {...g.knownRanks},
    currentIndex: g.currentIndex,
    selected: [...g.selected],
    gameOver: g.gameOver,
    winnerIds: g.winners ? g.winners.map(w=>w.id) : [],
    log: g.log.slice(-30),
  };
}
function reconstitutePairsGame(s){
  const g = Object.create(PairsGame.prototype);
  g.players = s.players.map(p=>({...p}));
  g.packCount = s.packCount;
  g.board = s.board.map(c => c ? {...c} : null);
  g.stock = s.stock.map(c=>({...c}));
  g.knownRanks = {...s.knownRanks};
  g.currentIndex = s.currentIndex;
  g.selected = [...(s.selected||[])];
  g.gameOver = s.gameOver;
  g.winners = (s.gameOver && s.winnerIds) ? g.players.filter(p=>s.winnerIds.includes(p.id)) : [];
  g.log = s.log ? [...s.log] : [];
  return g;
}

async function createPairsOnlineRoom(hostName){
  if(!hasSharedStorage()){ alert("Couldn't connect to the game server. Check your internet connection and try again."); return; }
  const code = generateRoomCode();
  const seatId = 'p_'+myDeviceId.slice(4,9);
  const room = {
    gameType: 'pairs', version: 1, phase: 'lobby', hostDeviceId: myDeviceId, code,
    lobbySeats: [ {id:seatId, name:(hostName||'Host').slice(0,16), isBot:false, deviceId:myDeviceId} ],
    packCount: 1,
  };
  const result = await storageSetSafe(pigRoomKey(code), JSON.stringify(room), true);
  if(!result){ alert('Could not create the room — check your connection and try again.'); return; }
  onlineMode = true; onlineRoomCode = code; onlineIsHost = true; onlineRoomState = room;
  activeGameId = 'pairs-online';
  startOnlinePolling();
  render();
}

async function joinPairsOnlineRoom(codeRaw, guestName){
  if(!hasSharedStorage()){ alert("Couldn't connect to the game server. Check your internet connection and try again."); return; }
  const code = (codeRaw||'').trim().toUpperCase();
  if(!code){ alert('Enter a room code.'); return; }
  const res = await storageGetSafe(pigRoomKey(code), true);
  if(!res){ alert("Couldn't find a room with that code — double check it with your friend."); return; }
  let room;
  try{ room = JSON.parse(res.value); } catch(e){ alert('That room looks corrupted — ask your friend to create a new one.'); return; }
  if(room.gameType!=='pairs'){ alert('That code belongs to a different game.'); return; }
  if(room.phase !== 'lobby'){ alert('That game has already started.'); return; }
  if(!room.lobbySeats.some(s=>s.deviceId===myDeviceId)){
    if(room.lobbySeats.length>=maxSeatsForGameType('pairs')){ alert('That room is full.'); return; }
    const seatId = 'p_'+myDeviceId.slice(4,9);
    room.lobbySeats.push({id:seatId, name:(guestName||'Player').slice(0,16), isBot:false, deviceId:myDeviceId});
    room.version = (room.version||1)+1;
    const writeResult = await storageSetSafe(pigRoomKey(code), JSON.stringify(room), true);
    if(!writeResult){ alert('Could not join right now — try again.'); return; }
  }
  onlineMode = true; onlineRoomCode = code; onlineIsHost = (room.hostDeviceId===myDeviceId); onlineRoomState = room;
  activeGameId = 'pairs-online';
  startOnlinePolling();
  render();
}

async function startPairsOnlineGame(){
  if(!onlineIsHost || !onlineRoomState) return;
  await refreshOnlineRoomState();
  const seats = onlineRoomState.lobbySeats;
  if(seats.length<2){ alert('Need at least 2 players to start.'); render(); return; }
  const packCount = onlineRoomState.packCount || 1;
  const gameInstance = new PairsGame(seats.map(s=>({id:s.id, name:s.name, isBot:s.isBot})), packCount);
  gameInstance.players.forEach((p,i)=>{ p.deviceId = seats[i].deviceId || null; });
  const newRoom = { ...onlineRoomState, phase:'playing', version: onlineRoomState.version+1, game: serializePairsGame(gameInstance) };
  const writeResult = await storageSetSafe(pigRoomKey(onlineRoomCode), JSON.stringify(newRoom), true);
  if(!writeResult){ alert('Could not start the game — try again.'); return; }
  onlineRoomState = newRoom;
  render();
  maybeDriveOnlinePairsBotTurn();
}

async function restartPairsOnlineGame(){
  if(!onlineIsHost || !onlineRoomState) return;
  await refreshOnlineRoomState();
  const newRoom = { ...onlineRoomState, phase:'lobby', version: onlineRoomState.version+1, game:null };
  const writeResult = await storageSetSafe(pigRoomKey(onlineRoomCode), JSON.stringify(newRoom), true);
  if(writeResult){ onlineRoomState = newRoom; render(); }
}

async function writePairsGameState(g){
  const newRoom = { ...onlineRoomState, version: onlineRoomState.version+1, game: serializePairsGame(g) };
  const writeResult = await storageSetSafe(pigRoomKey(onlineRoomCode), JSON.stringify(newRoom), true);
  if(writeResult){ onlineRoomState = newRoom; render(); maybeDriveOnlinePairsBotTurn(); }
  else { render(); }
}

async function onlineHumanPairsFlip(index){
  if(!onlineRoomState || uiLock) return;
  await refreshOnlineRoomState();
  if(!onlineRoomState || !onlineRoomState.game) return;
  const g = reconstitutePairsGame(onlineRoomState.game);
  if(g.gameOver){ render(); return; }
  const me = g.currentPlayer();
  if(me.deviceId !== myDeviceId || me.isBot){ render(); return; }
  const r = g.flip(index);
  if(!r) return;
  sfxCardFlip();
  if(r.needSecond){
    await writePairsGameState(g);
    return;
  }
  uiLock = true;
  await writePairsGameState(g); // show both cards face up to everyone before resolving
  setTimeout(async ()=>{
    await refreshOnlineRoomState();
    uiLock = false;
    if(!onlineRoomState || !onlineRoomState.game){ render(); return; }
    const g2 = reconstitutePairsGame(onlineRoomState.game);
    if(g2.selected.length<2){ render(); return; } // already resolved by someone/something else
    const result = g2.resolve();
    render();
    if(!result) return;
    if(result.match) sfxMatch(); else sfxNoMatch();
    if(result.gameEnded) sfxWin();
    await writePairsGameState(g2);
  }, 1000);
}

function botChoosePairsMoveFor(g){
  const open = g.board.map((c,i)=> (c && !c.faceUp) ? i : null).filter(i=>i!==null);
  const groups = {};
  for(const idx of open){
    const r = g.knownRanks[idx];
    if(r!==undefined){ (groups[r] = groups[r]||[]).push(idx); }
  }
  for(const r in groups){ if(groups[r].length>=2) return [groups[r][0], groups[r][1]]; }
  const known = open.filter(i=>g.knownRanks[i]!==undefined);
  const unknown = open.filter(i=>g.knownRanks[i]===undefined);
  if(known.length>0 && unknown.length>0){
    return [known[Math.floor(Math.random()*known.length)], unknown[Math.floor(Math.random()*unknown.length)]];
  }
  const pool = [...open].sort(()=>Math.random()-0.5);
  return pool.slice(0,2);
}

function maybeDriveOnlinePairsBotTurn(){
  if(!onlineMode || !onlineRoomState || onlineRoomState.phase!=='playing' || !onlineRoomState.game) return;
  if(onlineRoomState.gameType!=='pairs') return;
  if(onlineRoomState.game.gameOver) return;
  if(!onlineIsHost) return;
  if(onlineBotTurnInFlight) return;
  const g = reconstitutePairsGame(onlineRoomState.game);
  const cp = g.currentPlayer();
  if(!cp.isBot) return;
  onlineBotTurnInFlight = true;
  setTimeout(async ()=>{
    await refreshOnlineRoomState();
    if(!onlineRoomState.game){ onlineBotTurnInFlight=false; return; }
    const g2 = reconstitutePairsGame(onlineRoomState.game);
    if(g2.gameOver || g2.currentPlayer().id !== cp.id){ onlineBotTurnInFlight=false; return; }
    const move = botChoosePairsMoveFor(g2);
    if(!move || move.length<2 || move[0]===undefined || move[1]===undefined){
      onlineBotTurnInFlight=false;
      if(g2.boardCount()<=0 && !g2.gameOver){ g2.endGame(); await writePairsGameState(g2); }
      return;
    }
    const [i1,i2] = move;
    const r1 = g2.flip(i1);
    if(!r1){ onlineBotTurnInFlight=false; render(); return; }
    sfxCardFlip();
    await writePairsGameState(g2);
    setTimeout(async ()=>{
      await refreshOnlineRoomState();
      const g3 = reconstitutePairsGame(onlineRoomState.game);
      if(g3.gameOver || g3.currentPlayer().id !== cp.id){ onlineBotTurnInFlight=false; return; }
      const r2 = g3.flip(i2);
      if(!r2){ onlineBotTurnInFlight=false; render(); return; }
      sfxCardFlip();
      await writePairsGameState(g3);
      setTimeout(async ()=>{
        await refreshOnlineRoomState();
        const g4 = reconstitutePairsGame(onlineRoomState.game);
        if(g4.selected.length<2){ onlineBotTurnInFlight=false; return; }
        const result = g4.resolve();
        if(result){ if(result.match) sfxMatch(); else sfxNoMatch(); if(result.gameEnded) sfxWin(); }
        onlineBotTurnInFlight = false;
        await writePairsGameState(g4);
        if(result && result.match && !result.gameEnded){
          maybeDriveOnlinePairsBotTurn();
        } else {
          maybeDriveOnlineBotTurn();
        }
      }, 900);
    }, 700);
  }, 700);
}

function serializeBlackFiveGame(g){
  return {
    players: g.players.map(p=>({id:p.id, name:p.name, isBot:p.isBot, score:p.score, eliminated:p.eliminated, deviceId:p.deviceId||null,
      hand: p.hand.map(c=>({suit:c.suit, rank:c.rank, id:c.id}))})),
    dealerId: g.dealerId,
    roundOrder: [...g.roundOrder],
    deck: g.deck.map(c=>({suit:c.suit, rank:c.rank, id:c.id})),
    pile: g.pile.map(c=>({suit:c.suit, rank:c.rank, id:c.id})),
    activeSuit: g.activeSuit,
    currentIndex: g.currentIndex,
    drawPending: g.drawPending,
    skipPending: g.skipPending,
    log: g.log.slice(-40),
    roundNum: g.roundNum,
    gameOver: g.gameOver,
    winnerId: g.winner ? g.winner.id : null,
    awaitingSuitChoice: g.awaitingSuitChoice,
    startingSuitChoice: !!g.startingSuitChoice,
    roundResult: g.roundResult ? {
      winnerId: g.roundResult.winnerId, winnerName: g.roundResult.winnerName,
      results: g.roundResult.results.map(r=>({...r, hand: r.hand ? r.hand.map(c=>({suit:c.suit,rank:c.rank,id:c.id})) : []})),
    } : null,
    continuation: g.continuation,
  };
}
function reconstituteBlackFiveGame(s){
  const g = Object.create(BlackFiveGame.prototype);
  g.players = s.players.map(p=>({...p, hand: p.hand.map(c=>({...c}))}));
  g.dealerId = s.dealerId;
  g.roundOrder = [...s.roundOrder];
  g.deck = s.deck.map(c=>({...c}));
  g.pile = s.pile.map(c=>({...c}));
  g.activeSuit = s.activeSuit;
  g.currentIndex = s.currentIndex;
  g.drawPending = s.drawPending;
  g.skipPending = s.skipPending;
  g.log = s.log ? [...s.log] : [];
  g.roundNum = s.roundNum;
  g.gameOver = s.gameOver;
  g.winner = (s.gameOver && s.winnerId) ? g.players.find(p=>p.id===s.winnerId) : null;
  g.awaitingSuitChoice = s.awaitingSuitChoice;
  g.startingSuitChoice = s.startingSuitChoice;
  g.roundResult = s.roundResult ? {
    winnerId: s.roundResult.winnerId, winnerName: s.roundResult.winnerName,
    results: s.roundResult.results.map(r=>({...r, hand: r.hand ? r.hand.map(c=>({...c})) : []})),
  } : null;
  g.continuation = s.continuation;
  return g;
}

async function createBlack5OnlineRoom(hostName){
  if(!hasSharedStorage()){ alert("Couldn't connect to the game server. Check your internet connection and try again."); return; }
  const code = generateRoomCode();
  const seatId = 'p_'+myDeviceId.slice(4,9);
  const room = {
    gameType: 'black5', version: 1, phase: 'lobby', hostDeviceId: myDeviceId, code,
    lobbySeats: [ {id:seatId, name:(hostName||'Host').slice(0,16), isBot:false, deviceId:myDeviceId} ],
  };
  const result = await storageSetSafe(pigRoomKey(code), JSON.stringify(room), true);
  if(!result){ alert('Could not create the room — check your connection and try again.'); return; }
  onlineMode = true; onlineRoomCode = code; onlineIsHost = true; onlineRoomState = room;
  activeGameId = 'black5-online';
  startOnlinePolling();
  render();
}

async function joinBlack5OnlineRoom(codeRaw, guestName){
  if(!hasSharedStorage()){ alert("Couldn't connect to the game server. Check your internet connection and try again."); return; }
  const code = (codeRaw||'').trim().toUpperCase();
  if(!code){ alert('Enter a room code.'); return; }
  const res = await storageGetSafe(pigRoomKey(code), true);
  if(!res){ alert("Couldn't find a room with that code — double check it with your friend."); return; }
  let room;
  try{ room = JSON.parse(res.value); } catch(e){ alert('That room looks corrupted — ask your friend to create a new one.'); return; }
  if(room.gameType!=='black5'){ alert('That code belongs to a different game.'); return; }
  if(room.phase !== 'lobby'){ alert('That game has already started.'); return; }
  if(!room.lobbySeats.some(s=>s.deviceId===myDeviceId)){
    if(room.lobbySeats.length>=maxSeatsForGameType('black5')){ alert('That room is full.'); return; }
    const seatId = 'p_'+myDeviceId.slice(4,9);
    room.lobbySeats.push({id:seatId, name:(guestName||'Player').slice(0,16), isBot:false, deviceId:myDeviceId});
    room.version = (room.version||1)+1;
    const writeResult = await storageSetSafe(pigRoomKey(code), JSON.stringify(room), true);
    if(!writeResult){ alert('Could not join right now — try again.'); return; }
  }
  onlineMode = true; onlineRoomCode = code; onlineIsHost = (room.hostDeviceId===myDeviceId); onlineRoomState = room;
  activeGameId = 'black5-online';
  startOnlinePolling();
  render();
}

async function startBlack5OnlineGame(){
  if(!onlineIsHost || !onlineRoomState) return;
  await refreshOnlineRoomState();
  const seats = onlineRoomState.lobbySeats;
  if(seats.length<2){ alert('Need at least 2 players to start.'); render(); return; }
  const gameInstance = new BlackFiveGame(seats.map(s=>({id:s.id, name:s.name, isBot:s.isBot})));
  gameInstance.players.forEach((p,i)=>{ p.deviceId = seats[i].deviceId || null; });
  gameInstance.startRound();
  const newRoom = { ...onlineRoomState, phase:'playing', version: onlineRoomState.version+1, game: serializeBlackFiveGame(gameInstance) };
  const writeResult = await storageSetSafe(pigRoomKey(onlineRoomCode), JSON.stringify(newRoom), true);
  if(!writeResult){ alert('Could not start the game — try again.'); return; }
  onlineRoomState = newRoom;
  render();
  maybeDriveOnlineBotTurn();
}

async function restartBlack5OnlineGame(){
  if(!onlineIsHost || !onlineRoomState) return;
  await refreshOnlineRoomState();
  const newRoom = { ...onlineRoomState, phase:'lobby', version: onlineRoomState.version+1, game:null };
  const writeResult = await storageSetSafe(pigRoomKey(onlineRoomCode), JSON.stringify(newRoom), true);
  if(writeResult){ onlineRoomState = newRoom; render(); }
}

async function writeBlack5GameState(g){
  const newRoom = { ...onlineRoomState, version: onlineRoomState.version+1, game: serializeBlackFiveGame(g) };
  const writeResult = await storageSetSafe(pigRoomKey(onlineRoomCode), JSON.stringify(newRoom), true);
  if(writeResult){ onlineRoomState = newRoom; render(); maybeDriveOnlineBotTurn(); }
  else { render(); }
}

async function onlineBlack5PlayCard(cardId, chosenSuit){
  if(!onlineRoomState || uiLock) return;
  await refreshOnlineRoomState();
  if(!onlineRoomState || !onlineRoomState.game) return;
  const g = reconstituteBlackFiveGame(onlineRoomState.game);
  if(g.gameOver || g.roundResult){ render(); return; }
  const me = g.currentPlayer();
  if(me.deviceId !== myDeviceId || me.isBot){ render(); return; }
  let result;
  try{ result = g.playCard(me.id, cardId, chosenSuit); } catch(e){ render(); return; }
  sfxCardPlay();
  if(g.gameOver) sfxWin();
  await writeBlack5GameState(g);
}

async function onlineBlack5Draw(){
  if(!onlineRoomState || uiLock) return;

  if(!onlineRoomState || !onlineRoomState.game) return;
  const g = reconstituteBlackFiveGame(onlineRoomState.game);
  if(g.gameOver || g.roundResult){ render(); return; }
  const me = g.currentPlayer();
  if(me.deviceId !== myDeviceId || me.isBot){ render(); return; }
  sfxDraw();
  g.drawOne(me.id);
  await writeBlack5GameState(g);
}

async function onlineBlack5TakeDrawPenalty(){

  const me = g.currentPlayer();
  if(me.deviceId !== myDeviceId || me.isBot){ render(); return; }
  sfxDraw();
  g.resolveDrawPenalty(me.id);
  await writeBlack5GameState(g);
}

async function onlineBlack5ChooseSuit(suit){
  if(!onlineRoomState || uiLock) return;
  await refreshOnlineRoomState();
  if(!onlineRoomState || !onlineRoomState.game) return;
  const g = reconstituteBlackFiveGame(onlineRoomState.game);
  if(!g.awaitingSuitChoice){ render(); return; }
  const actorId = g.startingSuitChoice ? g.dealerId : g.currentPlayer().id;
  const actor = g.getPlayer(actorId);
  if(actor.deviceId !== myDeviceId || actor.isBot){ render(); return; }
  sfxSelect();
  g.resolveSuitChoice(suit);
  await writeBlack5GameState(g);
}

  g.startRound();
  await writeBlack5GameState(g);
  maybeDriveOnlineBotTurn();
}

function maybeDriveOnlineBlack5BotTurn(){
  if(!onlineMode || !onlineRoomState || onlineRoomState.phase!=='playing' || !onlineRoomState.game) return;
  if(onlineRoomState.gameType!=='black5') return;
  if(onlineRoomState.game.gameOver || onlineRoomState.game.roundResult) return;
  if(!onlineIsHost) return;
  if(onlineBotTurnInFlight) return;

  const g = reconstituteBlackFiveGame(onlineRoomState.game);

  if(g.awaitingSuitChoice){
    const actorId = g.startingSuitChoice ? g.dealerId : g.currentPlayer().id;
    const actor = g.getPlayer(actorId);
    if(!actor.isBot) return;
    onlineBotTurnInFlight = true;
    setTimeout(async ()=>{
      await refreshOnlineRoomState();
      if(!onlineRoomState.game){ onlineBotTurnInFlight=false; return; }
      const g2 = reconstituteBlackFiveGame(onlineRoomState.game);
      if(!g2.awaitingSuitChoice){ onlineBotTurnInFlight=false; return; }
      const actorId2 = g2.startingSuitChoice ? g2.dealerId : g2.currentPlayer().id;
      const actor2 = g2.getPlayer(actorId2);
      if(!actor2.isBot){ onlineBotTurnInFlight=false; return; }
      g2.resolveSuitChoice(g2.botChooseSuit(actor2));
      sfxSelect();
      await writeBlack5GameState(g2);
      onlineBotTurnInFlight = false;
      maybeDriveOnlineBotTurn();
    }, 500);
    return;
  }

  const cp = g.currentPlayer();
  if(!cp.isBot) return;
  onlineBotTurnInFlight = true;
  setTimeout(()=> runOnlineBlack5BotStep(cp.id), 650);
}

async function runOnlineBlack5BotStep(botId){
  await refreshOnlineRoomState();
  if(!onlineRoomState || !onlineRoomState.game){ onlineBotTurnInFlight=false; return; }
  const g = reconstituteBlackFiveGame(onlineRoomState.game);
  if(g.gameOver || g.roundResult){ onlineBotTurnInFlight=false; return; }
  if(g.currentPlayer().id !== botId){ onlineBotTurnInFlight=false; return; }
  const bot = g.getPlayer(botId);

  if(g.drawPending>0){
    const twos = bot.hand.filter(c=>c.rank==='2');
    if(twos.length>0 && Math.random()<0.85){
      let result;
      try{ result = g.playCard(bot.id, twos[0].id); }catch(e){ onlineBotTurnInFlight=false; return; }
      sfxCardPlay();
      await writeBlack5GameState(g);
      await continueOnlineBlack5BotChain(botId, result);
    } else {
      sfxDraw();
      g.resolveDrawPenalty(bot.id);
      await writeBlack5GameState(g);
      onlineBotTurnInFlight=false;
      maybeDriveOnlineBotTurn();
    }
    return;
  }
  if(g.skipPending){
    const jacks = bot.hand.filter(c=>c.rank==='J');
    if(jacks.length>0 && Math.random()<0.85){
      let result;
      try{ result = g.playCard(bot.id, jacks[0].id); }catch(e){ onlineBotTurnInFlight=false; return; }
      sfxCardPlay();
      await writeBlack5GameState(g);
      await continueOnlineBlack5BotChain(botId, result);
    } else {
      sfxPass();
      g.resolveSkipPenalty(bot.id);
      await writeBlack5GameState(g);
      onlineBotTurnInFlight=false;
      maybeDriveOnlineBotTurn();
    }
    return;
  }
  const valid = g.validPlays(bot);
  if(valid.length===0){
    sfxDraw();
    g.drawOne(bot.id);
    await writeBlack5GameState(g);
    onlineBotTurnInFlight=false;
    maybeDriveOnlineBotTurn();
    return;
  }
  const card = botChooseCard(bot, valid);
  const chosenSuit = card.rank==='A' ? g.botChooseSuit(bot) : undefined;
  let result;
  try{ result = g.playCard(bot.id, card.id, chosenSuit); }catch(e){ onlineBotTurnInFlight=false; return; }
  sfxCardPlay();
  if(g.gameOver) sfxWin();
  await writeBlack5GameState(g);
  await continueOnlineBlack5BotChain(botId, result);
}

async function continueOnlineBlack5BotChain(botId, r){
  if(!r || r.roundEnded){
    onlineBotTurnInFlight=false;
    maybeDriveOnlineBotTurn();
    return;
  }
  if(r.continue){
    setTimeout(async ()=>{
      await refreshOnlineRoomState();
      if(!onlineRoomState || !onlineRoomState.game){ onlineBotTurnInFlight=false; return; }
      const g = reconstituteBlackFiveGame(onlineRoomState.game);
      if(g.gameOver || g.roundResult || g.currentPlayer().id !== botId){ onlineBotTurnInFlight=false; return; }
      const bot = g.getPlayer(botId);
      const valid = g.validPlays(bot);
      if(valid.length===0){
        sfxDraw();
        g.drawOne(bot.id);
        await writeBlack5GameState(g);
        onlineBotTurnInFlight=false;
        maybeDriveOnlineBotTurn();
        return;
      }
      const card = botChooseCard(bot, valid);
      const chosenSuit = card.rank==='A' ? g.botChooseSuit(bot) : undefined;
      let result;
      try{ result = g.playCard(bot.id, card.id, chosenSuit); }catch(e){ onlineBotTurnInFlight=false; return; }
      sfxCardPlay();
      if(g.gameOver) sfxWin();
      await writeBlack5GameState(g);
      await continueOnlineBlack5BotChain(botId, result);
    }, 500);
    return;
  }
  onlineBotTurnInFlight=false;
  maybeDriveOnlineBotTurn();
}

/* ======================= SEVENS — ONLINE UI/LOGIC ======================= */
function serializeSevensGame(g){
  return {
    players: g.players.map(p=>({id:p.id, name:p.name, isBot:p.isBot, deviceId:p.deviceId||null,
      hand: p.hand.map(c=>({suit:c.suit, rank:c.rank, id:c.id}))})),
    turnOrder: [...g.turnOrder],
    currentIndex: g.currentIndex,
    board: JSON.parse(JSON.stringify(g.board)),
    firstMoveMade: g.firstMoveMade,
    log: g.log.slice(-40),
    gameOver: g.gameOver,
    winnerId: g.winner ? g.winner.id : null,
  };
}
function reconstituteSevensGame(s){
  const g = Object.create(SevensGame.prototype);
  g.players = s.players.map(p=>({...p, hand: p.hand.map(c=>({...c}))}));
  g.turnOrder = [...s.turnOrder];
  g.currentIndex = s.currentIndex;
  g.board = JSON.parse(JSON.stringify(s.board));
  g.firstMoveMade = s.firstMoveMade;
  g.log = s.log ? [...s.log] : [];
  g.gameOver = s.gameOver;
  g.winner = (s.gameOver && s.winnerId) ? g.players.find(p=>p.id===s.winnerId) : null;
  return g;
}

async function createSevensOnlineRoom(hostName){
  if(!hasSharedStorage()){ alert("Couldn't connect to the game server. Check your internet connection and try again."); return; }
  const code = generateRoomCode();
  const seatId = 'p_'+myDeviceId.slice(4,9);
  const room = {
    gameType: 'sevens', version: 1, phase: 'lobby', hostDeviceId: myDeviceId, code,
    lobbySeats: [ {id:seatId, name:(hostName||'Host').slice(0,16), isBot:false, deviceId:myDeviceId} ],
  };
  const result = await storageSetSafe(pigRoomKey(code), JSON.stringify(room), true);
  if(!result){ alert('Could not create the room — check your connection and try again.'); return; }
  onlineMode = true; onlineRoomCode = code; onlineIsHost = true; onlineRoomState = room;
  activeGameId = 'sevens-online';
  startOnlinePolling();
  render();
}

async function joinSevensOnlineRoom(codeRaw, guestName){
  if(!hasSharedStorage()){ alert("Couldn't connect to the game server. Check your internet connection and try again."); return; }
  const code = (codeRaw||'').trim().toUpperCase();
  if(!code){ alert('Enter a room code.'); return; }
  const res = await storageGetSafe(pigRoomKey(code), true);
  if(!res){ alert("Couldn't find a room with that code — double check it with your friend."); return; }
  let room;
  try{ room = JSON.parse(res.value); } catch(e){ alert('That room looks corrupted — ask your friend to create a new one.'); return; }
  if(room.gameType!=='sevens'){ alert('That code belongs to a different game.'); return; }
  if(room.phase !== 'lobby'){ alert('That game has already started.'); return; }
  if(!room.lobbySeats.some(s=>s.deviceId===myDeviceId)){
    if(room.lobbySeats.length>=maxSeatsForGameType('sevens')){ alert('That room is full.'); return; }
    const seatId = 'p_'+myDeviceId.slice(4,9);
    room.lobbySeats.push({id:seatId, name:(guestName||'Player').slice(0,16), isBot:false, deviceId:myDeviceId});
    room.version = (room.version||1)+1;
    const writeResult = await storageSetSafe(pigRoomKey(code), JSON.stringify(room), true);
    if(!writeResult){ alert('Could not join right now — try again.'); return; }
  }
  onlineMode = true; onlineRoomCode = code; onlineIsHost = (room.hostDeviceId===myDeviceId); onlineRoomState = room;
  activeGameId = 'sevens-online';
  startOnlinePolling();
  render();
}

async function startSevensOnlineGame(){
  if(!onlineIsHost || !onlineRoomState) return;
  await refreshOnlineRoomState();
  const seats = onlineRoomState.lobbySeats;
  if(seats.length<3){ alert('Need at least 3 players to start.'); render(); return; }
  const gameInstance = new SevensGame(seats.map(s=>({id:s.id, name:s.name, isBot:s.isBot})));
  gameInstance.dealAndStart();
  gameInstance.players.forEach(p=>{ const seat = seats.find(s=>s.id===p.id); p.deviceId = seat ? (seat.deviceId||null) : null; });
  const newRoom = { ...onlineRoomState, phase:'playing', version: onlineRoomState.version+1, game: serializeSevensGame(gameInstance) };
  const writeResult = await storageSetSafe(pigRoomKey(onlineRoomCode), JSON.stringify(newRoom), true);
  if(!writeResult){ alert('Could not start the game — try again.'); return; }
  onlineRoomState = newRoom;
  render();
  maybeDriveOnlineBotTurn();
}

async function restartSevensOnlineGame(){
  if(!onlineIsHost || !onlineRoomState) return;
  await refreshOnlineRoomState();
  const newRoom = { ...onlineRoomState, phase:'lobby', version: onlineRoomState.version+1, game:null };
  const writeResult = await storageSetSafe(pigRoomKey(onlineRoomCode), JSON.stringify(newRoom), true);
  if(writeResult){ onlineRoomState = newRoom; render(); }
}

async function writeSevensGameState(g){
  const newRoom = { ...onlineRoomState, version: onlineRoomState.version+1, game: serializeSevensGame(g) };
  const writeResult = await storageSetSafe(pigRoomKey(onlineRoomCode), JSON.stringify(newRoom), true);
  if(writeResult){ onlineRoomState = newRoom; render(); maybeDriveOnlineBotTurn(); }
  else { render(); }
}

async function onlineSevensPlayCard(cardId){
  if(!onlineRoomState || uiLock) return;
  await refreshOnlineRoomState();
  if(!onlineRoomState || !onlineRoomState.game) return;
  const g = reconstituteSevensGame(onlineRoomState.game);
  if(g.gameOver) { render(); return; }
  const me = g.currentPlayer();
  if(me.deviceId !== myDeviceId || me.isBot){ render(); return; }
  let result;
  try{ result = g.playCard(me.id, cardId); } catch(e){ render(); return; }
  sfxCardPlay();
  if(g.gameOver) sfxWin();
  await writeSevensGameState(g);
}

async function onlineSevensPass(){
  if(!onlineRoomState || uiLock) return;
  await refreshOnlineRoomState();
  if(!onlineRoomState || !onlineRoomState.game) return;
  const g = reconstituteSevensGame(onlineRoomState.game);
  if(g.gameOver){ render(); return; }
  const me = g.currentPlayer();
  if(me.deviceId !== myDeviceId || me.isBot){ render(); return; }
  if(g.validPlaysFor(me).length>0){ render(); return; } // has a play, can't voluntarily pass
  sfxPass();
  g.passTurn(me.id);
  await writeSevensGameState(g);
}

function maybeDriveOnlineSevensBotTurn(){
  if(!onlineMode || !onlineRoomState || onlineRoomState.phase!=='playing' || !onlineRoomState.game) return;
  if(onlineRoomState.gameType!=='sevens') return;
  if(onlineRoomState.game.gameOver) return;
  if(!onlineIsHost) return;
  if(onlineBotTurnInFlight) return;
  const g = reconstituteSevensGame(onlineRoomState.game);
  const cp = g.currentPlayer();
  if(!cp.isBot) return;
  onlineBotTurnInFlight = true;
  setTimeout(async ()=>{
    await refreshOnlineRoomState();
    if(!onlineRoomState.game){ onlineBotTurnInFlight=false; return; }
    const g2 = reconstituteSevensGame(onlineRoomState.game);
    if(g2.gameOver || g2.currentPlayer().id !== cp.id){ onlineBotTurnInFlight=false; return; }
    const bot = g2.getPlayer(cp.id);
    const valid = g2.validPlaysFor(bot);
    if(valid.length===0){
      sfxPass();
      g2.passTurn(bot.id);
    } else {
      const card = sevensBotChoosePlay(bot, valid);
      try{ g2.playCard(bot.id, card.id); } catch(e){ onlineBotTurnInFlight=false; return; }
      sfxCardPlay();
      if(g2.gameOver) sfxWin();
    }
    await writeSevensGameState(g2);
    onlineBotTurnInFlight = false;
    maybeDriveOnlineBotTurn();
  }, 650);
}

/* ======================= BONK — ONLINE UI/LOGIC ======================= */
function serializeBonkGame(g){
  return {
    players: g.players.map(p=>({id:p.id, name:p.name, isBot:p.isBot, lives:p.lives, eliminated:p.eliminated, deviceId:p.deviceId||null,
      hand: p.hand.map(c=>({suit:c.suit, rank:c.rank, id:c.id}))})),
    seatOrder: [...g.seatOrder],
    dealerId: g.dealerId,
    roundOrder: [...g.roundOrder],
    currentIndex: g.currentIndex,
    pile: g.pile.map(c=>({suit:c.suit, rank:c.rank, id:c.id})),
    streak: g.streak.map(s=>({playerId:s.playerId, card:{suit:s.card.suit, rank:s.card.rank, id:s.card.id}})),
    log: g.log.slice(-40),
    roundNum: g.roundNum,
    roundComplete: g.roundComplete,
    gameOver: g.gameOver,
    winnerId: g.winner ? g.winner.id : null,
  };
}
function reconstituteBonkGame(s){
  const g = Object.create(BonkGame.prototype);
  g.players = s.players.map(p=>({...p, hand: p.hand.map(c=>({...c}))}));
  g.seatOrder = [...s.seatOrder];
  g.dealerId = s.dealerId;
  g.roundOrder = [...s.roundOrder];
  g.currentIndex = s.currentIndex;
  g.pile = s.pile.map(c=>({...c}));
  g.streak = s.streak.map(x=>({playerId:x.playerId, card:{...x.card}}));
  g.log = s.log ? [...s.log] : [];
  g.roundNum = s.roundNum;
  g.roundComplete = s.roundComplete;
  g.gameOver = s.gameOver;
  g.winner = (s.gameOver && s.winnerId) ? g.players.find(p=>p.id===s.winnerId) : null;
  return g;
}

async function createBonkOnlineRoom(hostName){
  if(!hasSharedStorage()){ alert("Couldn't connect to the game server. Check your internet connection and try again."); return; }
  const code = generateRoomCode();
  const seatId = 'p_'+myDeviceId.slice(4,9);
  const room = {
    gameType: 'bonk', version: 1, phase: 'lobby', hostDeviceId: myDeviceId, code,
    lobbySeats: [ {id:seatId, name:(hostName||'Host').slice(0,16), isBot:false, deviceId:myDeviceId} ],
  };
  const result = await storageSetSafe(pigRoomKey(code), JSON.stringify(room), true);
  if(!result){ alert('Could not create the room — check your connection and try again.'); return; }
  onlineMode = true; onlineRoomCode = code; onlineIsHost = true; onlineRoomState = room;
  activeGameId = 'bonk-online';
  startOnlinePolling();
  render();
}

async function joinBonkOnlineRoom(codeRaw, guestName){
  if(!hasSharedStorage()){ alert("Couldn't connect to the game server. Check your internet connection and try again."); return; }
  const code = (codeRaw||'').trim().toUpperCase();
  if(!code){ alert('Enter a room code.'); return; }
  const res = await storageGetSafe(pigRoomKey(code), true);
  if(!res){ alert("Couldn't find a room with that code — double check it with your friend."); return; }
  let room;
  try{ room = JSON.parse(res.value); } catch(e){ alert('That room looks corrupted — ask your friend to create a new one.'); return; }
  if(room.gameType!=='bonk'){ alert('That code belongs to a different game.'); return; }
  if(room.phase !== 'lobby'){ alert('That game has already started.'); return; }
  if(!room.lobbySeats.some(s=>s.deviceId===myDeviceId)){
    if(room.lobbySeats.length>=maxSeatsForGameType('bonk')){ alert('That room is full.'); return; }
    const seatId = 'p_'+myDeviceId.slice(4,9);
    room.lobbySeats.push({id:seatId, name:(guestName||'Player').slice(0,16), isBot:false, deviceId:myDeviceId});
    room.version = (room.version||1)+1;
    const writeResult = await storageSetSafe(pigRoomKey(code), JSON.stringify(room), true);
    if(!writeResult){ alert('Could not join right now — try again.'); return; }
  }
  onlineMode = true; onlineRoomCode = code; onlineIsHost = (room.hostDeviceId===myDeviceId); onlineRoomState = room;
  activeGameId = 'bonk-online';
  startOnlinePolling();
  render();
}

async function startBonkOnlineGame(){
  if(!onlineIsHost || !onlineRoomState) return;
  await refreshOnlineRoomState();
  const seats = onlineRoomState.lobbySeats;
  if(seats.length<2){ alert('Need at least 2 players to start.'); render(); return; }
  const gameInstance = new BonkGame(seats.map(s=>({id:s.id, name:s.name, isBot:s.isBot})));
  gameInstance.players.forEach(p=>{ const seat = seats.find(s=>s.id===p.id); p.deviceId = seat ? (seat.deviceId||null) : null; });
  gameInstance.startRound();
  const newRoom = { ...onlineRoomState, phase:'playing', version: onlineRoomState.version+1, game: serializeBonkGame(gameInstance) };
  const writeResult = await storageSetSafe(pigRoomKey(onlineRoomCode), JSON.stringify(newRoom), true);
  if(!writeResult){ alert('Could not start the game — try again.'); return; }
  onlineRoomState = newRoom;
  render();
  maybeDriveOnlineBotTurn();
}

async function restartBonkOnlineGame(){
  if(!onlineIsHost || !onlineRoomState) return;
  await refreshOnlineRoomState();
  const newRoom = { ...onlineRoomState, phase:'lobby', version: onlineRoomState.version+1, game:null };
  const writeResult = await storageSetSafe(pigRoomKey(onlineRoomCode), JSON.stringify(newRoom), true);
  if(writeResult){ onlineRoomState = newRoom; render(); }
}

async function writeBonkGameState(g){
  const newRoom = { ...onlineRoomState, version: onlineRoomState.version+1, game: serializeBonkGame(g) };
  const writeResult = await storageSetSafe(pigRoomKey(onlineRoomCode), JSON.stringify(newRoom), true);
  if(writeResult){ onlineRoomState = newRoom; render(); maybeDriveOnlineBotTurn(); }
  else { render(); }
}

async function onlineBonkPlayCard(cardId){
  if(!onlineRoomState || uiLock) return;
  await refreshOnlineRoomState();
  if(!onlineRoomState || !onlineRoomState.game) return;
  const g = reconstituteBonkGame(onlineRoomState.game);
  if(g.gameOver || g.roundComplete){ render(); return; }
  const me = g.currentPlayer();
  if(me.deviceId !== myDeviceId || me.isBot){ render(); return; }
  let result;
  try{ result = g.playCard(me.id, cardId); } catch(e){ return; }
  sfxCardPlay();
  if(result.bonkEvent){
    const be = result.bonkEvent;
    sfxBonk(be.lifeLoss);
    showToast(`💥 ${be.tierName}! ${be.victimName} loses ${be.lifeLoss} life${be.lifeLoss!==1?'s':''}!`);
    const victim = g.getPlayer(be.victimId);
    if(victim && victim.eliminated) sfxEliminated();
  }
  if(g.gameOver) sfxWin();
  await writeBonkGameState(g);
}

async function onlineBonkNextRound(){
  if(!onlineIsHost || !onlineRoomState) return;
  await refreshOnlineRoomState();
  if(!onlineRoomState.game) return;
  const g = reconstituteBonkGame(onlineRoomState.game);
  if(!g.roundComplete || g.gameOver){ render(); return; }
  g.startRound();
  await writeBonkGameState(g);
  maybeDriveOnlineBotTurn();
}

function maybeDriveOnlineBonkBotTurn(){
  if(!onlineMode || !onlineRoomState || onlineRoomState.phase!=='playing' || !onlineRoomState.game) return;
  if(onlineRoomState.gameType!=='bonk') return;
  if(onlineRoomState.game.gameOver || onlineRoomState.game.roundComplete) return;
  if(!onlineIsHost) return;
  if(onlineBotTurnInFlight) return;
  const g = reconstituteBonkGame(onlineRoomState.game);
  const cp = g.currentPlayer();
  if(!cp.isBot) return;
  onlineBotTurnInFlight = true;
  setTimeout(async ()=>{
    await refreshOnlineRoomState();
    if(!onlineRoomState.game){ onlineBotTurnInFlight=false; return; }
    const g2 = reconstituteBonkGame(onlineRoomState.game);
    if(g2.gameOver || g2.roundComplete || g2.currentPlayer().id !== cp.id){ onlineBotTurnInFlight=false; return; }
    const bot = g2.getPlayer(cp.id);
    const card = bonkBotChoosePlay(bot, g2);
    let result;
    try{ result = g2.playCard(bot.id, card.id); } catch(e){ onlineBotTurnInFlight=false; return; }
    sfxCardPlay();
    if(result.bonkEvent){
      const be = result.bonkEvent;
      sfxBonk(be.lifeLoss);
      showToast(`💥 ${be.tierName}! ${be.victimName} loses ${be.lifeLoss} life${be.lifeLoss!==1?'s':''}!`);
      const victim = g2.getPlayer(be.victimId);
      if(victim && victim.eliminated) sfxEliminated();
    }
    if(g2.gameOver) sfxWin();
    await writeBonkGameState(g2);
    onlineBotTurnInFlight = false;
    maybeDriveOnlineBotTurn();
  }, 650);
}

/* ---------- Greedy Pig interaction handlers ---------- */
function humanPigRoll(){
  if(uiLock || !game || game.gameOver) return;
  const actor = game.currentPlayer();
  if(actor.isBot) return;
  sfxDiceRoll();
  const lostAmount = game.turnTotal;
  const r = game.roll();
  if(r.bust){ (lostAmount>20 ? sfxBigBust() : sfxBust()); showToast(`${actor.name} rolled a 1 — turn over!`); }
  render();
  maybeRunGreedyPigBotTurn();
}

function humanPigBank(){
  if(uiLock || !game || game.gameOver) return;
  const actor = game.currentPlayer();
  if(actor.isBot) return;
  sfxBank();
  const result = game.bank();
  if(result && result.won){ sfxWin(); showToast(`${actor.name} wins with ${actor.score} points! 🎉`); }
  render();
  maybeRunGreedyPigBotTurn();
}

function maybeRunGreedyPigBotTurn(){
  if(!game || game.gameOver) return;
  const cp = game.currentPlayer();
  if(!cp.isBot) return;
  uiLock = true;
  render();
  setTimeout(()=> runGreedyPigBotTurn(cp), 700);
}

function runGreedyPigBotTurn(bot){
  if(!game || game.gameOver){ uiLock=false; if(game) render(); return; }
  if(game.currentPlayer().id !== bot.id){ uiLock=false; render(); return; }

  if(game.botShouldBank()){
    sfxBank();
    const result = game.bank();
    if(result && result.won){ sfxWin(); showToast(`${bot.name} wins with ${bot.score} points! 🎉`); }
    uiLock=false;
    render();
    maybeRunGreedyPigBotTurn();
    return;
  }
  sfxDiceRoll();
  const lostAmount = game.turnTotal;
  const r = game.roll();
  if(r.bust){
    (lostAmount>20 ? sfxBigBust() : sfxBust());
    showToast(`${bot.name} rolled a 1 — turn over!`);
    uiLock=false;
    render();
    maybeRunGreedyPigBotTurn();
    return;
  }
  render();
  setTimeout(()=> runGreedyPigBotTurn(bot), 700);
}

/* ---------- Pairs interaction handlers ---------- */
function humanPairsFlip(index){
  if(uiLock || !game || game.gameOver) return;
  const cp = game.currentPlayer();
  if(cp.isBot) return;
  const r = game.flip(index);
  if(!r) return;
  sfxCardFlip();
  if(r.needSecond){
    render();
    return;
  }
  uiLock = true;
  render();
  setTimeout(()=>{
    const result = game.resolve();
    uiLock = false;
    render();
    if(!result) return;
    if(result.match) sfxMatch(); else sfxNoMatch();
    if(result.gameEnded){ sfxWin(); return; }
    if(!result.match) maybeRunPairsBotTurn();
  }, 1000);
}

function botChoosePairsMove(){
  const open = game.board.map((c,i)=> (c && !c.faceUp) ? i : null).filter(i=>i!==null);
  const groups = {};
  for(const idx of open){
    const r = game.knownRanks[idx];
    if(r!==undefined){
      (groups[r] = groups[r]||[]).push(idx);
    }
  }
  for(const r in groups){
    if(groups[r].length>=2) return [groups[r][0], groups[r][1]];
  }
  const known = open.filter(i=>game.knownRanks[i]!==undefined);
  const unknown = open.filter(i=>game.knownRanks[i]===undefined);
  if(known.length>0 && unknown.length>0){
    return [known[Math.floor(Math.random()*known.length)], unknown[Math.floor(Math.random()*unknown.length)]];
  }
  const pool = [...open].sort(()=>Math.random()-0.5);
  return pool.slice(0,2);
}

function maybeRunPairsBotTurn(){
  if(!game || game.gameOver) return;
  const cp = game.currentPlayer();
  if(!cp.isBot) return;
  uiLock = true;
  render();
  setTimeout(()=> runPairsBotTurn(cp), 700);
}

function runPairsBotTurn(bot){
  if(!game || game.gameOver){ uiLock=false; if(game) render(); return; }
  if(game.currentPlayer().id !== bot.id){ uiLock=false; render(); return; }
  const move = botChoosePairsMove();
  if(!move || move.length<2 || move[0]===undefined || move[1]===undefined){
    console.warn('Pairs: bot had no valid two-card move, forcing a defensive game check.', move, 'boardCount:', game.boardCount());
    uiLock=false;
    if(game.boardCount()<=0 && !game.gameOver) game.endGame();
    render();
    return;
  }
  const [i1, i2] = move;
  const r1 = game.flip(i1);
  sfxCardFlip();
  render();
  if(!r1){ uiLock=false; render(); return; }
  setTimeout(()=>{
    const r2 = game.flip(i2);
    sfxCardFlip();
    render();
    if(!r2){ uiLock=false; render(); return; }
    setTimeout(()=>{
      const result = game.resolve();
      if(!result){ uiLock=false; render(); return; }
      if(result.match) sfxMatch(); else sfxNoMatch();
      if(result.gameEnded){ sfxWin(); uiLock=false; render(); return; }
      if(result.match){
        render();
        setTimeout(()=> runPairsBotTurn(bot), 700);
      } else {
        uiLock=false;
        render();
        maybeRunPairsBotTurn();
      }
    }, 900);
  }, 700);
}

function maybeRunSevensBotTurn(){
  if(!game || game.gameOver) return;
  const cp = game.currentPlayer();
  if(!cp.isBot) return;
  uiLock = true;
  render();
  setTimeout(()=> runSevensBotTurn(cp), 650);
}

function runSevensBotTurn(bot){
  if(!game || game.gameOver){ uiLock=false; if(game) render(); return; }
  if(game.currentPlayer().id !== bot.id){ uiLock=false; return; }
  const valid = game.validPlaysFor(bot);
  if(valid.length===0){
    sfxPass();
    game.passTurn(bot.id);
    uiLock=false;
    afterSevensAction();
    return;
  }
  const card = sevensBotChoosePlay(bot, valid);
  let result;
  try{ result = game.playCard(bot.id, card.id); } catch(e){ uiLock=false; return; }
  sfxCardPlay();
  if(result.gameOver) sfxWin();
  uiLock=false;
  afterSevensAction();
}

function renderBonkRulesPanel(){
  const wrap = document.createElement('div');
  wrap.className = 'rules-content';
  wrap.innerHTML = `
    <h4>Setup</h4>
    <p>2–6 players. A random player deals first; the dealer rotates clockwise each round. Everyone is dealt 5 cards, and the player clockwise of the dealer plays first. Everyone starts with 5 lives.</p>

    <h4>Playing a card</h4>
    <p>No restrictions — play any card from your hand, any time it's your turn.</p>

    <h4>BONK!</h4>
    <ul>
      <li>If the card you play matches the <strong>rank</strong> of the card just played before it, that's a <strong>BONK</strong> — whoever played that first matching card loses 1 life.</li>
      <li>If the run of matches keeps going (a third card of the same rank in a row), that's a <strong>Double BONK</strong> — the player caught this time loses 2 lives.</li>
      <li>A fourth in a row is a <strong>Triple BONK</strong> — 3 lives lost. It keeps escalating the longer the run goes.</li>
      <li>Playing a different rank breaks the run — the next match starts a fresh count.</li>
    </ul>

    <h4>Winning</h4>
    <p>Once everyone's hand is empty, a new round is dealt (cards reshuffled, dealer rotates) and lives carry over. A player is eliminated at 0 lives — last one standing wins.</p>

function humanPlayersBonk(){ return game.players.filter(p=>!p.isBot); }

function bonkStreakText(g){
  if(g.streak.length<=1) return '';
  const rank = g.streak[g.streak.length-1].card.rank;
  return `🔥 Streak: ${g.streak.length}× ${rank}s in a row`;
}

function onBonkPlayCard(playerId, cardId){
  if(uiLock) return;
  let result;
  try{ result = game.playCard(playerId, cardId); } catch(e){ return; }
  sfxCardPlay();
  if(result.bonkEvent){
    const be = result.bonkEvent;
    sfxBonk(be.lifeLoss);
    showToast(`💥 ${be.tierName}! ${be.victimName} loses ${be.lifeLoss} life${be.lifeLoss!==1?'s':''}!`);
    const victim = game.getPlayer(be.victimId);
    if(victim && victim.eliminated) sfxEliminated();
  }
  if(game.gameOver) sfxWin();
  afterBonkAction();
}

function afterBonkAction(){
  render();
  maybeRunBonkBotTurn();
}

function bonkBotChoosePlay(bot, g){
  if(g.streak.length>0){
    const matching = bot.hand.filter(c=>c.rank===g.streak[g.streak.length-1].card.rank);
    if(matching.length>0) return matching[Math.floor(Math.random()*matching.length)];
  }
  return bot.hand[Math.floor(Math.random()*bot.hand.length)];
}

/* ======================= TRUMPS UI (local) ======================= */
function renderTrumpsRulesPanel(){
  const wrap = document.createElement('div');
  wrap.className = 'rules-content';
  wrap.innerHTML = `
    <h4>Setup</h4>
    <p>2–4 players. A random player deals first; the dealer rotates clockwise each round. Round 1 deals 7 cards each, with one extra card turned face up to set trumps for that round.</p>

    <h4>Hand sizes</h4>
    <p>Each round the hand size drops by one — 7, 6, 5, 4, 3, then 2 — and stays at 2 every round after that.</p>

    <h4>Playing a trick</h4>
    <ul>
      <li>The player to the dealer's left leads the first trick. Whoever wins a trick leads the next one.</li>
      <li>You must follow the suit that was led if you can. If you can't, you may play anything — including a trump.</li>
      <li>Any trump beats any card of another suit, no matter the rank. If no trump is played, the highest card of the suit led wins.</li>
    </ul>

    <h4>Calling the next trump</h4>
    <p>After round 1, whoever won the most tricks that round calls the trump suit for the next one. If there's a tie, the tied players cut the deck — highest card wins the call.</p>

    <h4>Elimination &amp; winning</h4>
    <p>Win zero tricks in a round and you're out. Play continues until only one player is left — they win the game.</p>
  `;
  return wrap;
}

function humanPlayersTrumps(){ return game.players.filter(p=>!p.isBot); }

function sortTrumpsHand(hand){
  const suitOrder = {S:0,H:1,D:2,C:3};
  return [...hand].sort((a,b)=>{
    if(a.suit!==b.suit) return suitOrder[a.suit]-suitOrder[b.suit];
    return RANKS.indexOf(a.rank)-RANKS.indexOf(b.rank);
  });
}

function trumpsBotChoosePlay(bot, g){
  const valid = g.validPlaysFor(bot);
  if(g.trick.length===0){
    const sorted = [...valid].sort((a,b)=>RANKS.indexOf(a.rank)-RANKS.indexOf(b.rank));
    return sorted[Math.floor(sorted.length/2)];
  }
  const trumpsPlayed = g.trick.filter(t=>t.card.suit===g.trumpSuit);
  const pool = trumpsPlayed.length>0 ? trumpsPlayed : g.trick.filter(t=>t.card.suit===g.leadSuit);
  let currentBest = pool[0];
  for(const entry of pool){ if(RANKS.indexOf(entry.card.rank)>RANKS.indexOf(currentBest.card.rank)) currentBest = entry; }

  function wouldWin(card){
    if(card.suit===g.trumpSuit){
      if(currentBest.card.suit!==g.trumpSuit) return true;
      return RANKS.indexOf(card.rank) > RANKS.indexOf(currentBest.card.rank);
    }
    if(currentBest.card.suit===g.trumpSuit) return false;
    if(card.suit!==g.leadSuit) return false;
    return RANKS.indexOf(card.rank) > RANKS.indexOf(currentBest.card.rank);
  }
  const winners = valid.filter(wouldWin).sort((a,b)=>RANKS.indexOf(a.rank)-RANKS.indexOf(b.rank));
  if(winners.length>0) return winners[0];
  const nonTrump = valid.filter(c=>c.suit!==g.trumpSuit).sort((a,b)=>RANKS.indexOf(a.rank)-RANKS.indexOf(b.rank));
  if(nonTrump.length>0) return nonTrump[0];
  const sorted = [...valid].sort((a,b)=>RANKS.indexOf(a.rank)-RANKS.indexOf(b.rank));
  return sorted[0];
}

function trumpsBotChooseTrump(bot){
  const counts = {S:0,H:0,D:0,C:0};
  bot.hand.forEach(c=>{ counts[c.suit]++; });
  let best = 'S', bestCount = -1;
  SUITS.forEach(s=>{ if(counts[s]>bestCount){ bestCount=counts[s]; best=s; } });
  return best;
}

function onTrumpsCutDeck(playerId){
  if(uiLock) return;
  let result;
  try{ result = game.cutDeck(playerId); } catch(e){ return; }
  sfxCardFlip();
  uiLock = true;
  const justResolved = !game.awaitingCut;
  if(justResolved) trumpsCutResultPause = true;
  render();
  setTimeout(()=>{
    uiLock = false;
    if(justResolved) trumpsCutResultPause = false;
    render();
    if(game.awaitingCut) maybeRunTrumpsCutBot();
  }, justResolved ? 2400 : 1300);
}

function maybeRunTrumpsCutBot(){
  if(!game || !game.awaitingCut || uiLock) return;
  const nextId = game.cutContenderIds[game.cutDraws.length];
  const player = game.getPlayer(nextId);
  if(!player.isBot) return;
  uiLock = true;
  render();
  setTimeout(()=>{
    let result;
    try{ result = game.cutDeck(nextId); } catch(e){ uiLock=false; return; }
    sfxCardFlip();
    const justResolved = !game.awaitingCut;
    if(justResolved) trumpsCutResultPause = true;
    render();
    setTimeout(()=>{
      uiLock = false;
      if(justResolved) trumpsCutResultPause = false;
      render();
      if(game.awaitingCut) maybeRunTrumpsCutBot();
    }, justResolved ? 2400 : 100);
  }, 1000);
}


function proceedAfterTrumpsRound(){
  game.startRound(); // deals the new round's hands; sets awaitingTrumpCall if round > 1
  const multiHuman = humanPlayersTrumps().length>1;
  if(game.awaitingTrumpCall){
    const caller = game.getPlayer(game.trumpCallerId);
    if(caller.isBot){
      game.chooseNextTrump(trumpsBotChooseTrump(caller));
      revealedForId = multiHuman ? null : (humanPlayersTrumps()[0]?.id || null);
      render();
      maybeRunTrumpsBotTurn();
    } else {
      revealedForId = multiHuman ? null : caller.id;
      render();
    }
  } else {
    revealedForId = multiHuman ? null : (humanPlayersTrumps()[0]?.id || null);
    render();
    maybeRunTrumpsBotTurn();
  }
}
